# The Phase-6 external-architecture proof: a consumer game that must live
# OUTSIDE the workspace so it exercises exactly what a third-party crate
# would — the `ambition_platformer2d` umbrella via a path dependency, its own lockfile,
# no workspace dependency table, no policy exemptions.
exclude = ["fixtures/external_consumer"]
resolver = "2"

# One version per shared external dependency. Before this table existed, `ron`
# was pinned 0.11 in thirteen manifests and 0.12 in one, and `thiserror` 1 in
# three — so the workspace compiled two copies of each. Add a crate here when a
# second manifest wants it; keep per-crate FEATURE sets in the member manifests
# (they legitimately differ).
#
# NOTE: `bevy` is deliberately NOT here yet. It is pinned in ~46 manifests, each
# with a carefully trimmed and genuinely different feature set (see
# `ambition_menu` for why that matters), so the conversion is its own reviewable
# pass — tracked in docs/planning/tracks.md.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.11"
thiserror = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Jon Crall + ChatGPT + Claude"]
description = "Ambition: a code-generated endgame movement sandbox for a mathematical AI-first platformer."

# A plain `--release` build of this app is ~220 MB, which can take a browser a minute to compile
# and presents as "the page loads and nothing happens" — the same symptom as a panic, which is
# why it is worth being able to rule out.
#
# opt-in (`./build_for_web.sh --optimize`), because fat LTO + one codegen unit
# turns a ~6 minute build into a much longer one, and the ordinary web dev loop
# wants the fast build.
[profile.ship]
# Native distribution profile: this is the artifact policy used by
# `./run_game.sh --ship`.  Optimize across the complete crate graph and emit
# one codegen unit so LLVM can see as much of the final program as possible.
# Keep the build portable across supported Steam PCs: CPU-specific tuning
# belongs in separately targeted packages, never in this baseline profile.
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.android-size]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"


[profile.android-profile]
inherits = "release"
# Optimized like release, but keep enough DWARF in the native library for
# host simpleperf / addr2line to recover Rust function names in Android profiles.
debug = 1
strip = "none"
split-debuginfo = "off"

[profile.dev]
# Optional, but often good for Bevy/game dev:
# optimize your own workspace crates a little without going full release.
opt-level = 1

# Huge disk saver versus full DWARF debug info.
# Keeps useful file/line backtraces.
debug = "line-tables-only"

# Incremental can make target/debug enormous.
# Leave true if you strongly value fast edit-compile cycles;
# set false if disk size is the priority.
incremental = true

[profile.dev.package."*"]
# Optimize registry/git deps like Bevy, wgpu, image codecs, math crates, etc.
opt-level = 3

# Big disk saver for dependencies.
debug = false

# More release-like behavior for dependencies.
debug-assertions = false
overflow-checks = false

# Codegen-heavy workspace crates that are NOT hot loops under test. Measured:
# workspace members get `profile.dev`'s opt-level=1 (the `package."*"` glob above
# applies to dependencies only), and `ambition_platformer2d_runtime` spent 91 of
# its 120 build seconds in codegen. Neither crate carries a per-tick numeric
# kernel — the runtime is schedule/rollback plumbing and render never runs
# headless — so dropping their codegen cost buys edit-compile time without
# slowing what the tests actually spend their time doing.
[profile.dev.package.ambition_platformer2d_runtime]
opt-level = 0

[profile.dev.package.ambition_render]
opt-level = 0

# `ambition_app` joins them. It is the SECOND
# most-edited crate in the repo and it is composition — plugin wiring, CLI, menu
# assembly — with no per-tick numeric kernel of its own.
#
#   | config              | 3000-tick sim | build after an app-source edit |
#   |---------------------|---------------|--------------------------------|
#   | opt-1 (baseline)    | 2.57 / 2.67s  | 32.4s                          |
#   | app opt-0           | 2.49 / 2.52s  | 23.3s                          |
#   | monolith opt-0      | 4.08 / 4.16s  | 33.4s                          |
#
# So the app pays 28% of the edit loop back and costs NOTHING to run.
#
# and the actor monolith is deliberately NOT here. It is the single
# most-edited crate, so it is the obvious next candidate, and it is the wrong one:
# at opt-0 the simulation runs 1.6x slower (4.08s against 2.57s over the same
# 3000 ticks, tight variance across repeats) while doing nothing at all for an
# app-source edit. That crate IS the per-tick numeric kernel this comment's first
# paragraph excludes — the exclusion was written as a judgement and is now a
# number. Its 1169 tests execute in 0.58s either way, so the TEST suite would
# never have caught the cost; only running the sim does.
[profile.dev.package.ambition_app]
opt-level = 0

[profile.dev.build-override]
# Build scripts / proc macros are separate from normal deps.
# Usually keep these cheap to compile.
opt-level = 0
debug = false
codegen-units = 256

# ────────────────────────── patched dependencies ──────────────────────────
# Crates we consume with a local change that upstream has not released yet.
# Each entry is a TEMPORARY bridge and must name the condition that deletes it.
# Pinned by `rev`, never by branch: a branch would drift silently under
# `cargo update` and make builds unreproducible.
[patch.crates-io]
# Backports a first-class `GgrsFrameTiming` accessor (timestep / overstep / overstep_fraction)
# onto the v0.21.0 line so presentation can read the intra-tick phase under rollback via a
# supported API — no reaching into driver internals. Branched from the v0.21.0 tag so it stays
# semver-compatible with the `bevy_ggrs = "0.21"` requirement AND on bevy 0.18 — upstream main
# carries the same commit at 0.22 / bevy 0.19, which we are not on. Consumer is tagged
# FORK(ggrs-frame-timing). RETIRE when the accessor ships in a released bevy_ggrs: drop this
# entry, bump the requirement, use the released API.
bevy_ggrs = { git = "https://github.com/Erotemic/bevy_ggrs", rev = "4d2eff2a89f00c127e17fd26dd3f25d3a1113fa2" }
