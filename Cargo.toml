# Deliberately external: dev/bevy_ceiling measures stock Bevy empty-window cost;
# dev/bevy_idle_systems measures executor overhead. Both own separate lockfiles.
# fixtures/external_consumer tests the public ambition_platformer2d umbrella
# as a third-party consumer, without workspace-only policy exemptions.
exclude = ["fixtures/external_consumer", "dev/bevy_ceiling", "dev/bevy_idle_systems"]
resolver = "2"

# Centralize shared versions to avoid compiling duplicates (previously ron
# 0.11/0.12 and thiserror 1/2); keep each member's feature selection.
# Bevy stays per-crate: ~46 manifests deliberately trim different features.
# Revisit through the feature audit in docs/planning/tracks.md.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.11"
serde_path_to_error = "0.1"
thiserror = "2"
# New tool CLIs use clap derive for consistent flags and generated --help
# (project decision 2026-09-03).
clap = { version = "4", features = ["derive"] }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Jon Crall + ChatGPT + Claude"]
description = "Ambition: a code-generated endgame movement sandbox for a mathematical AI-first platformer."

# ./run_game.sh --ship: optimized distribution with fat LTO, one codegen
# unit and stripped symbols. Avoid host-specific CPU flags for Steam portability.
[profile.ship]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# ./run_game.sh profiling: optimize like release, retain perf/Tracy/addr2line symbols.
# perf --call-graph fp yielded empty stacks (2026-09-01). A Cargo profile
# force-frame-pointers key is ignored; RUSTFLAGS=-C force-frame-pointers=yes
# would rebuild the crate graph. The missed caller was in prebuilt std/glibc,
# so that change alone would not resolve the original investigation.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
split-debuginfo = "off"

# Dependencies keep line tables, not full DWARF; symbol names remain available.
[profile.profiling.package."*"]
debug = "line-tables-only"

# Web size optimization is opt-in via ./build_for_web.sh --optimize: fat LTO
# costs build time; a plain web --release artifact was ~220 MB in testing.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.android-size]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Android profiling keeps limited DWARF for simpleperf and addr2line.
[profile.android-profile]
inherits = "release"
debug = 1
strip = "none"
split-debuginfo = "off"

# The dev playtest and edit loop: `run_game.sh --dev`. It stays cargo's own
# default for plain `cargo run` and `cargo test`.
# Favor small artifacts and edit/build speed over optimized runtime and
# detailed postmortem diagnostics.
# Incremental edit rebuild: 21.3s vs 104.9s without it (2026-08-07).
# Past opt-1 baseline: app opt-0 rebuilt in 23.3s vs 32.4s; actor-monolith
# opt-0 slowed a 3000-tick sim from ~2.57s to ~4.08s. The all-workspace
# opt-0 policy now explicitly accepts that playtest slowdown.
# Split debuginfo trial (2026-09-03): 9,938 .dwo files, +324 MB net disk,
# rebuilds 7m24s vs 2m53s. Keep split-debuginfo unset.
# sccache cannot cache incremental Rust compilation; measure before trading
# away incremental for compiler caching.
# See dev/journals/compile-time-and-disk-2026-08-07.md and
# docs/planning/demos/super-smash-siblings.md.
[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = true

# Third-party dependencies (Bevy, wgpu, codecs) remain optimized for
# playable runtime and cache reuse, at the cost of slower cold builds.
# Workspace crates use opt-level 0; dependency checks below are disabled.
[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

# Separate cheap codegen for build scripts and proc macros.
[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 256

# Temporary upstream fixes: pin immutable revisions, not moving branches.
# Each patch needs an explicit retirement condition.
[patch.crates-io]
# GgrsFrameTiming (timestep, overstep, overstep_fraction) merged upstream in
# gschup/bevy_ggrs#134 after v0.22.0; this pins the upstream merge.
# RETIRE once a published release contains #134.
# Upstream uses ggrs git main, with its revision pinned by Cargo.lock.
# A cargo update -p ggrs can change deterministic rollback: update the guard
# in scripts/tests/test_sdk_manifest_advice_is_current.py and remeasure.
bevy_ggrs = { git = "https://github.com/gschup/bevy_ggrs", rev = "f1853823bfb888fcd9d468a136bb81fd6b9ed481" }
# Caches QueryState instead of rematching all archetypes on every touch update;
# old path cost ~1.2% Android Mary-O CPU (see
# docs/planning/engine/performance-and-iteration.md).
# RETIRE once virtual_joystick releases the fix.
virtual_joystick = { git = "https://github.com/Erotemic/virtual_joystick", rev = "e6a4a3c7b3c22a976a7b57f0a26f7fcc01a7944d" }
