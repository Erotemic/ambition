authoring_description: Mary-O v2 is an additive second-draft reinterpretation of the accepted Super Mary-O family. It preserves
  the platformer movement vocabulary and form progression while redrafting the silhouette, cap, bodice, skirt, boots, wing
  language, and fire-form ornamentation as a coherent costume.
gameplay_description: Use the Mary-O v2 Tall sheet as a responsive retro-platform hero in her tall state. Games may opt into
  running, jumping, skidding, climbing, swimming, growth, or fireball actions according to the form's published animation
  set.
dialogue_hints:
  barks:
  - A clear jump is a kind of argument.
  - The level can keep its royal road. I brought running shoes.
  - One more platform.
