[package]
name = "ambition_abilities"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The WIELDED ability kit: ranged (beam, meteor, shockwave, volley, vortex, sentry, bomb), thrown gravity grenades, the traversal verbs a held item fires (blink, dive, grapple, mark/recall), and the cooldown they share. Carved from the actor kernel (D33, 2026-09-03). ⛔ NOT possession/teleport/trapdoor/flyline — those are control authority and runtime-registered, and actor-monolith-decomposition.md records why they stay."

[lib]
crate-type = ["rlib"]

[features]
# ⛔ The kernel's remaining abilities (the puppy-slug gun) test against the same
# fixtures this crate moved. Exporting them behind a feature is how the gun keeps
# its tests without the kernel reaching into a private module of a lower crate.
test-support = []

[dependencies]
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
ambition_platformer2d_world = { path = "../ambition_platformer2d_world" }
ambition_characters = { path = "../ambition_characters" }
ambition_combat = { path = "../ambition_combat" }
ambition_held_items = { path = "../ambition_held_items" }
ambition_items = { path = "../ambition_items" }
ambition_projectiles = { path = "../ambition_projectiles" }
ambition_boss_encounter = { path = "../ambition_boss_encounter" }
ambition_gameplay_trace = { path = "../ambition_gameplay_trace" }
ambition_sfx = { path = "../ambition_sfx" }
ambition_vfx = { path = "../ambition_vfx" }
ambition_time = { path = "../ambition_time" }
# ⛔ NEVER ambition_platformer2d_actor_monolith: that edge is what the carve removed.
bevy = { version = "0.19.1", default-features = false, features = ["bevy_state"] }
