[package]
name = "ambition_audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Authored-audio stack: data schema, Kira playback library, adaptive music director."

[features]
default = []
# The playback half (library/render/music director/web unlock). Off by
# default so headless hosts get the data schema without the Kira backend.
kira = ["dep:bevy_kira_audio", "bevy/bevy_input_focus"]
# The authored-content schemas this capability owns (`music_registry`,
# `sfx_registry`). OPTIONAL and default-OFF for the same §2e reason as every
# other capability's: a game that never validates its content must not link a
# compiler.
content_pack = ["dep:ambition_content_pack", "dep:ron"]

[dependencies]
ambition_sfx = { path = "../ambition_sfx" }
ambition_content_pack = { path = "../ambition_content_pack", optional = true }
bevy = { version = "0.19.1", default-features = false }
bevy_kira_audio = { version = "0.26", default-features = false, features = ["wav", "ogg"], optional = true }
# Only the schema handlers parse RON here; the registries themselves are handed
# to this crate already deserialized everywhere else.
ron = { workspace = true, optional = true }
serde = { workspace = true }
