[package]
name = "ambition_boss_special_port"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The pure values of the boss domain's extension trigger port: a boss special was pressed, and what the boss looked like at the read cut."

# A leaf on purpose: a procedural module reads these values and must build
# without Bevy, the host, or the boss domain's runtime. The boss domain
# (`ambition_boss_encounter::extension`) owns the adapter that fills them.
[dependencies]
ambition_extension_sdk = { path = "../ambition_extension_sdk" }
