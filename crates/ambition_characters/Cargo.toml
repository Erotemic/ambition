[package]
name = "ambition_characters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified actor system for Ambition: actor control/AI vocabulary + the universal brain (player, NPC, enemy, boss) + the character catalog. Bosses are actors (ADR 0016)."

[dependencies]
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
# The content-free ability vocabulary (MoveSpec / EffectRef / ParamValue). A
# downward edge (entity_catalog is a leaf): the universal-brain `Special` action
# carries an `EffectRef`'s opaque `ParamValue` so a content technique hydrates
# its own params (fable review A1 / R2.2).
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
# The binding-resolution boundary (`Resolver` / `BindingReport` / `Namespace`),
# which is what character PREPARATION is written in terms of. A downward edge:
# shared_tangle depends on `ambition_projectile_spec` and `ambition_platformer2d_core`
# and on nothing else, so taking it does not reach gameplay — checked against
# `check_absence_contracts.py`'s transitive rule, not assumed (campaign P1.7).
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
# The content compiler. A downward edge to a foundation crate with no Bevy and
# no domain types: the character capability OWNS its authored schema, so the
# registration lives here rather than in a central content enum.
#
# OPTIONAL and default-OFF, and the footprint ratchet is what said so: a
# movement-only game (`fixtures/minimal_game`) must not link a content compiler
# it never asked for — §2e, "a perfectly semantic API can still force a game to
# link every unrelated domain". Nothing at RUNTIME consumes a prepared pack yet;
# the compiler is a build-time and tooling concern, so the honest default is
# off. Turn it on when a composition wants its content validated (see
# `ambition_content_cli`), and again when the runtime starts reading a
# `PreparedContentPack` instead of an `include_str!`.
ambition_content_pack = { path = "../ambition_content_pack", optional = true }
# Structured causal facts. Zero dependencies of its own, and OPTIONAL for the
# same §2e reason as the compiler above: a movement-only game must not link an
# instrument it never turns on. Its cost when linked-and-off is one thread-local
# load per decision — the same cost the `AMBITION_FIGHTER_TRACE` env check it
# replaces already paid.
ambition_causal = { path = "../ambition_causal", optional = true }
bevy = { version = "0.18.1", default-features = false, features = ["bevy_log"] }
ron = { workspace = true }
serde = { workspace = true }

[features]
# The authored-content schema this capability owns. See the dependency note.
content_pack = ["dep:ambition_content_pack"]
# Publish this capability's causal facts (brain decisions, for now).
causal = ["dep:ambition_causal"]
