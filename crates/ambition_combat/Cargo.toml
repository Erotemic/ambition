[package]
name = "ambition_combat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Reusable, content-free combat MODEL: Damage / Hitbox / Hurtbox / DamageVolume, the AttackIntent / AttackPhase / AttackSpec attack vocabulary + intent resolution, and the action-slot kinds. Pure logic over the actor + geometry foundations; the game's ECS combat systems consume it. Extracted from ambition_platformer2d_actor_monolith."

[lib]
crate-type = ["rlib"]

[dependencies]
# The brain MeleeActionSpec the attack specs reference.
ambition_characters = { path = "../ambition_characters" }
# The content compiler. OPTIONAL and default-OFF (§2e): a game that never
# validates its content must not link one. The combat capability owns the
# `character_archetypes` schema because it owns the type that file parses into.
ambition_content_pack = { path = "../ambition_content_pack", optional = true }
# Structured causal facts. Optional and default-off (§2e): a game that never
# opens an inspector must not link one.
ambition_causal = { path = "../ambition_causal", features = ["bevy"], optional = true }
# Geometry (Vec2 / Aabb / AabbExt / KinematicPath).
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
# Tier-0 authored-placement schema: DamageKind / DamageTeam / HazardRespawn.
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
# The moved combat kit (E2): lifecycle/gravity markers, breakable payloads,
# effect messages, and the shared sim clock.
ambition_interaction = { path = "../ambition_interaction" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
ambition_sfx = { path = "../ambition_sfx" }
ambition_time = { path = "../ambition_time" }
ambition_vfx = { path = "../ambition_vfx" }
# `CollisionWorld` — the down-air pogo in `attack_support` probes the room for a
# world orb. A clean downward edge: `_world` sees only asset_manager / _core /
# entity_catalog / shared_tangle.
ambition_platformer2d_world = { path = "../ambition_platformer2d_world" }
# `ActorSpriteMetrics` — `body_geometry` derives a body's hurtbox from the
# sprite's per-animation boxes. Downward: `sprite_sheet` names neither `combat`
# nor `boss_encounter`.
ambition_sprite_sheet = { path = "../ambition_sprite_sheet" }
# Authored-hazard serde (the room-IR ron-room bake carries DamageVolume).
# Only the schema handler parses RON here.
ron = { workspace = true, optional = true }
serde = { workspace = true }
# One Resource derive (the slot registry); ECS surface only.
bevy = { version = "0.18.1", default-features = false }

[features]
# The authored-content schema this capability owns.
content_pack = ["dep:ambition_content_pack", "dep:ron"]
# Publish this crate's causal facts (the stock lifecycle, for now).
causal = ["dep:ambition_causal"]
