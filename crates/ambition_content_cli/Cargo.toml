[package]
name = "ambition_content_cli"
version = "0.1.0"
edition = "2024"
description = "The content-pack validator's diagnostic front door. Composes the same schema registry the app composes and calls the same `ambition_content_pack::compile`."

# THIS CRATE MUST NOT EMBED CONTENT.
#
# Its whole reason to exist is that editing a character RON does not rebuild
# Rust. An `include_str!` here — or a dependency on a crate that has one for the
# pack being validated — reintroduces exactly the coupling the tool removes, and
# it would do so silently: the tool would still work, just slowly, and nobody
# would notice until someone timed it.
[dependencies]
ambition_content_pack = { path = "../ambition_content_pack" }
# ⭐⭐ THE SIX CAPABILITY CRATES ARE GONE FROM HERE, AND THAT IS THE OTHER HALF OF
# THE COLLAPSE. They were declared so this manifest's own `default_registry()`
# could spell each registration; that list moved to `ambition_engine_schemas`,
# and leaving the deps behind would have been the SAME defect one level down —
# two hand-kept copies of "which six crates own the engine's schemas", one in
# each manifest, with nothing holding them equal.
#
# ⚠ The composition is unchanged: this binary still links all six, transitively
# and by exactly one declaration. MEASURED by member, not by count: the closure
# goes 324 -> 325 and the single addition is `ambition_engine_schemas` itself.
# Every other member is identical and `ambition_platformer2d` is still absent.
ambition_engine_schemas = { path = "../ambition_engine_schemas" }

[[bin]]
name = "ambition_content"
path = "src/main.rs"
test = false
bench = false
