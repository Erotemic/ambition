[package]
name = "ambition_content_cli"
version = "0.1.0"
edition = "2024"
description = "The content-pack validator's diagnostic front door. Composes the same schema registry the app composes and calls the same `ambition_content_pack::compile`."

# THIS CRATE MUST NOT EMBED CONTENT.
#
# Its whole reason to exist is that editing a character RON does not rebuild
# Rust. An `include_str!` here — or a dependency on a crate that has one for the
# pack being validated — reintroduces exactly the coupling the tool removes, and
# it would do so silently: the tool would still work, just slowly, and nobody
# would notice until someone timed it.
[dependencies]
ambition_content_pack = { path = "../ambition_content_pack" }
# Capability crates, for their schema registrations. Each contributes the
# schemas it owns; which ones are linked here IS the composition this CLI
# validates against, and it is why "uninstalled capability" is a real refusal.
ambition_characters = { path = "../ambition_characters", features = ["content_pack"] }
# ⭐ THE BOSS SCHEMAS MOVED WITH THE BOSS'S THINKING (D168, 2026-08-27). This
# tool registers every authored schema, so it follows them; same
# `content_pack` feature, same reason.
ambition_boss_encounter = { path = "../ambition_boss_encounter", features = ["content_pack"] }
ambition_items = { path = "../ambition_items", features = ["content_pack"] }
# The encounter capability owns `encounter_waves`. the CLI must judge Ambition's
# content by the SAME rules the game does — a test pins the two registries equal
# — so a schema added to one belongs in the other in the same commit.
ambition_encounter = { path = "../ambition_encounter", features = ["content_pack"] }
ambition_audio = { path = "../ambition_audio", features = ["content_pack"] }
ambition_combat = { path = "../ambition_combat", features = ["content_pack"] }

[[bin]]
name = "ambition_content"
path = "src/main.rs"
test = false
bench = false
