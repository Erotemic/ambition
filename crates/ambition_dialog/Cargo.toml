[package]
name = "ambition_dialog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Reusable dialogue runtime: the poll-based DialogState view model (typewriter reveal + option selection), the typewriter-SFX selection rules, the input/reveal Bevy systems, and the bevy_yarnspinner↔DialogState bridge plus the generic Yarn binding-installer seam. Content-free — a host's game-specific Yarn commands/functions register through the installer seam; the host maps DialogState.active onto its own session mode. Extracted from ambition_platformer2d_actor_monolith (E1c)."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Enables the bevy_yarnspinner bridge + binding-installer machinery. Without
# it the crate is just the view model + reveal/SFX logic (headless-safe).
ui = ["dep:bevy_yarnspinner"]
# Forwarded from the host: real keyboard/gamepad + pointer input translators.
# Without it the input systems compile as no-op stubs.
input = ["ambition_input/input", "ambition_ui_nav/input"]

[dependencies]
# Vec2 for pointer/reveal geometry.
# MenuFocusState + windowed-list / pointer-row helpers + MenuInputFrame scroll.
ambition_ui_nav = { path = "../ambition_ui_nav" }
# MenuControlFrame (input feature) + MenuInputFrame.
ambition_input = { path = "../ambition_input" }
# SfxMessage / SfxId / cue ids for the typewriter blips + markup accents.
ambition_sfx = { path = "../ambition_sfx" }
# settings::{MenuTapMode, UserSettings} (crates/ambition_dialog/src/systems.rs).
# Was AmbitionGameSave for per-node visit-count bookkeeping; that moved to the
# sim schedule (actor_monolith::session::durable_horizon) and this crate no
# longer names it.
ambition_persistence = { path = "../ambition_persistence" }
# UI data does not select a window backend. The host selects platform support.
bevy = { version = "0.19.1", default-features = false, features = ["ui_api"] }
bevy_yarnspinner = { version = "0.9", optional = true }
