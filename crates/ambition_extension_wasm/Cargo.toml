[package]
name = "ambition_extension_wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The WebAssembly backend of the extension host: a module built against the SDK runs in an interpreter, so an edit to it rebuilds the module and never the engine."

# wasmi: a pure-Rust WebAssembly interpreter. Chosen over a JIT for the first
# backend because it is deterministic by construction (`deterministic`
# canonicalizes NaNs), meters work with fuel rather than a clock, and builds
# for every target the engine ships (fast-iteration I6, M1 measures its cost).
[dependencies]
ambition_extension_host = { path = "../ambition_extension_host" }
ambition_extension_sdk = { path = "../ambition_extension_sdk" }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "deterministic"] }

[dev-dependencies]
wasmi = { version = "2", default-features = false, features = ["std", "validate", "deterministic", "wat"] }
wat = "1"
