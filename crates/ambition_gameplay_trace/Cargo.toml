[package]
name = "ambition_gameplay_trace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Reusable, content-free gameplay flight-recorder format: the per-frame trace schema (GameplayTraceFrame / GameplayTraceEvent), the rolling GameplayTraceBuffer resource, and the markdown/JSON dump writers. The game's sim systems fill the buffer; this crate owns the format the replay harness reads. Extracted from ambition_platformer2d_actor_monolith."

[lib]
crate-type = ["rlib"]

[dependencies]
# Resource derive on GameplayTraceBuffer (ECS surface only — no render/audio).
bevy = { version = "0.19.1", default-features = false }

# Geometry (Vec2) for the player-snapshot fields, and `ControlFrame` — the
# input snapshot stored per trace frame (`src/model.rs:7`). ⚠ That second fact
# was attributed to an `ambition_input` dependency here until 2026-09-18;
# `ambition_input/src/lib.rs:69` only FORWARDS the type, and this crate takes
# the owner's road.
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }

# The on-disk trace schema is serde-serialized for the dump writers.
serde = { workspace = true }
serde_json = "1"
