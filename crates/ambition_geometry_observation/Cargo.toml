[package]
name = "ambition_geometry_observation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Read-only observation of the geometry gameplay tests: a descriptor, a registry of providers that owning crates install, and one entry point that F1 and headless inspection share (GOBS-1)."

[lib]
crate-type = ["rlib"]

[dependencies]
# The ECS surface only: providers are one-shot systems over the owner's own
# read models. No render: F1 draws the descriptors elsewhere.
bevy_app = { version = "0.19.1", default-features = false }
bevy_ecs = { version = "0.19.1", default-features = false }
serde = { workspace = true }
serde_json = "1"
