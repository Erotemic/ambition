[package]
name = "ambition_held_items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The PRESSED collectible: a GroundItem in the world, an empty hand that takes it, the held spec it overlays on the action set, use, throw, ground physics and custody-driven residency. Carved from the actor kernel (D33, 2026-09-03); the sibling of ambition_world_items across the touched/pressed split."

[lib]
crate-type = ["rlib"]

[features]
# The portal gun is a held item with its own crate; a composition without
# portals pays nothing for it.
portal = ["dep:ambition_portal2d"]

[dependencies]
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_characters = { path = "../ambition_characters" }
ambition_combat = { path = "../ambition_combat" }
ambition_items = { path = "../ambition_items" }
ambition_mount = { path = "../ambition_mount" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
ambition_platformer2d_world = { path = "../ambition_platformer2d_world" }
ambition_time = { path = "../ambition_time" }
ambition_portal2d = { path = "../ambition_portal2d", optional = true }
# ⛔ NEVER ambition_platformer2d_actor_monolith: that edge is what the carve removed.
bevy = { version = "0.19.1", default-features = false, features = ["bevy_state"] }

[dev-dependencies]
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
ambition_input = { path = "../ambition_input" }
ambition_sfx = { path = "../ambition_sfx" }
