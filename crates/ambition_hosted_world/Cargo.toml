[package]
name = "ambition_hosted_world"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A hosted world's replication: the host's bodies reach a guest App by SimId (NET-AUTHORITY-EXPERIMENT)."

[features]
renet = ["dep:bevy_replicon_renet"]

[lib]
crate-type = ["rlib"]

[dependencies]
bevy = { version = "0.19.1", default-features = false }
# The last line for Bevy 0.19 (engine/hosted-world-networking-experiment.md,
# "Library evaluation"). No I/O of its own: the link is the caller's.
bevy_replicon = { version = "0.44", default-features = false, features = ["client", "server"] }
serde = { workspace = true }
# A real link (UDP, renet's netcode), the release for replicon 0.44. Optional:
# the in-process test link needs none.
bevy_replicon_renet = { version = "0.20", optional = true, default-features = false, features = ["client", "server", "renet_netcode"] }
ambition_boss_encounter = { path = "../ambition_boss_encounter" }
ambition_characters = { path = "../ambition_characters" }
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
ambition_platformer2d_actor_spawn = { path = "../ambition_platformer2d_actor_spawn" }
ambition_sprite_sheet = { path = "../ambition_sprite_sheet" }
ambition_combat = { path = "../ambition_combat" }
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_platformer2d_runtime = { path = "../ambition_platformer2d_runtime" }
ambition_platformer2d_actor_monolith = { path = "../ambition_platformer2d_actor_monolith" }
ambition_platformer2d_session = { path = "../ambition_platformer2d_session" }
ambition_platformer2d_world = { path = "../ambition_platformer2d_world" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
