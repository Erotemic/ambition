[package]
name = "ambition_inventory_ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Reusable inventory menu-navigation state for Ambition-style platformers."

[lib]
crate-type = ["rlib"]

[dependencies]
# The input-context vocabulary, so an open inventory can DECLARE that it owns
# the seat's input instead of every router deriving it from `GameMode`. Already
# in this crate's graph through `ambition_ui_nav`; named directly because the
# claim is this crate's own fact, not a re-export it happens to reach.
ambition_input = { path = "../ambition_input" }
ambition_ui_nav = { path = "../ambition_ui_nav" }
bevy = { version = "0.19.1", default-features = false, features = ["bevy_state"] }
