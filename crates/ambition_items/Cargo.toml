[package]
name = "ambition_items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Reusable item catalog and shop primitives for Ambition-style platformers."

[lib]
crate-type = ["rlib"]

[dependencies]
# Backend-neutral rollback declaration vocabulary only; no runtime/GGRS dependency.
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_characters = { path = "../ambition_characters" }
# `equipment` derives a body's live moveset from its granted verbs.
ambition_combat = { path = "../ambition_combat" }
ambition_persistence = { path = "../ambition_persistence" }
# The content compiler, OPTIONAL and default-OFF for the same §2e reason as
# `ambition_characters`: a game that never validates its content must not link a
# compiler. The items capability OWNS the `item_catalog` schema, so the
# registration lives here rather than in a central content enum.
ambition_content_pack = { path = "../ambition_content_pack", optional = true }
bevy = { version = "0.19.1", default-features = false, features = ["bevy_state"] }
ron = { workspace = true }
serde = { workspace = true }

[features]
# The authored-content schema this capability owns. See the dependency note.
content_pack = ["dep:ambition_content_pack"]
