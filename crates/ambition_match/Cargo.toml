[package]
name = "ambition_match"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The versus match, prepared: the participant roster and its three staging shapes, the rules of the stage, prepare_match (every fallible seat question answered before a body exists) and the rollback-safe receipt of the live match. The actor kernel activates the plan; this crate never names the kernel. Carved from the actor kernel's character_runtime (D33, character preparation versus actor simulation, 2026-09-03)."

[lib]
crate-type = ["rlib"]

[dependencies]
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_body_seed = { path = "../ambition_body_seed" }
ambition_characters = { path = "../ambition_characters" }
ambition_combat = { path = "../ambition_combat" }
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
ambition_input = { path = "../ambition_input" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
ambition_sprite_sheet = { path = "../ambition_sprite_sheet" }
# ⛔ NEVER ambition_platformer2d_actor_monolith: the kernel activates the plan this crate prepares.
bevy = { version = "0.19.1", default-features = false }

[dev-dependencies]
ambition_characters = { path = "../ambition_characters", features = ["test-support"] }
