[package]
name = "ambition_platformer2d_assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Asset catalog assembly, character materialization, and startup asset loading."

[features]
default = []
static_content = []
ldtk_runtime = ["dep:bevy_ecs_ldtk", "dep:bevy_asset_loader"]

[dependencies]
ambition_combat = { path = "../ambition_combat" }
ambition_time = { path = "../ambition_time" }
bevy = { version = "0.19.1", default-features = false }
serde.workspace = true
ron.workspace = true
bevy_ecs_ldtk = { version = "0.15.0", optional = true }
bevy_asset_loader = { version = "0.27.0", optional = true }
ambition_asset_manager = { path = "../ambition_asset_manager", features = ["bevy"] }
ambition_audio = { path = "../ambition_audio" }
ambition_boss_encounter = { path = "../ambition_boss_encounter" }
ambition_characters = { path = "../ambition_characters" }
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
ambition_match = { path = "../ambition_match" }
ambition_persistence = { path = "../ambition_persistence" }
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
ambition_platformer2d_world = { path = "../ambition_platformer2d_world" }
ambition_projectiles = { path = "../ambition_projectiles" }
ambition_sfx = { path = "../ambition_sfx" }
ambition_sprite_sheet = { path = "../ambition_sprite_sheet" }

[dev-dependencies]
ambition_characters = { path = "../ambition_characters", features = ["test-support"] }
