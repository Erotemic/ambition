[package]
name = "ambition_platformer2d_rollback_ggrs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GGRS rollback backend for the Ambition platformer runtime."

[dependencies]
ambition_platformer2d_runtime = { path = "../ambition_platformer2d_runtime" }
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
# The MOUNT PAIR's `Mounted` marker — reconciliation asks whether a body is
# being carried. `ambition_mount` owns the pair now (D33).
ambition_mount = { path = "../ambition_mount" }
ambition_platformer2d_actor_monolith = { path = "../ambition_platformer2d_actor_monolith", default-features = false, features = ["headless", "input"] }
# The room vocabulary this crate queries (`RoomSet`) is the world crate's, not
# the monolith's; it reached it through a re-export until 2026-08-26.
ambition_platformer2d_world = { path = "../ambition_platformer2d_world" }
ambition_characters = { path = "../ambition_characters" }
ambition_input = { path = "../ambition_input" }
ambition_load = { path = "../ambition_load" }
ambition_sim_view = { path = "../ambition_sim_view", features = ["input"] }
bevy_ggrs = "0.21"
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_asset",
    "bevy_image",
    "bevy_state",
] }

[features]
default = []
# The crate that owns `bevy_ggrs` owns its target-specific clock forwarding.
web_platform = ["bevy_ggrs/wasm-bindgen"]
