[package]
name = "ambition_platformer2d_world"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Authored room data and live world geometry: room graphs, placements, moving platforms, and collision composition."

[features]
default = []

[dependencies]
bevy_log = { version = "0.19.1", default-features = false }
ambition_registry_core = { path = "../ambition_registry_core" }
# Asset identities do not require the asset manager's Bevy integration.
ambition_asset_manager = { path = "../ambition_asset_manager", default-features = false }
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
ambition_entity_catalog = { path = "../ambition_entity_catalog" }
ambition_time = { path = "../ambition_time" }
# `FeatureEcsWorldOverlay` — the per-frame dynamic contribution `CollisionWorld`
# composites onto the authored room (R3). Content-free vocabulary; this crate
# depends on nothing but `engine_core` itself, so the edge stays downward.
ambition_platformer2d_shared_tangle = { path = "../ambition_platformer2d_shared_tangle" }
bevy_app = { version = "0.19.1", default-features = false }
bevy_ecs = { version = "0.19.1", default-features = false }
# The compute pool a navigation graph is built on, one surface to a task
# (`NavGraph::build_avoiding`): the graph is the same as built on one thread.
bevy_tasks = { version = "0.19.1", default-features = false }
petgraph = "0.8"
ron = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# A pool with more than one thread, for the test that a graph built on one is
# the graph one thread builds.
bevy_tasks = { version = "0.19.1", default-features = false, features = ["multi_threaded"] }
