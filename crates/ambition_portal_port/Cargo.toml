[package]
name = "ambition_portal_port"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The pure values of the portal domain's extension ports: a held pair of portals a module may ask for."

# A leaf on purpose: a procedural module submits these values and must build
# without Bevy, the host, or the portal runtime. `ambition_portal2d::extension`
# owns the adapter that keeps the portals.
[dependencies]
ambition_extension_sdk = { path = "../ambition_extension_sdk" }
