[package]
name = "ambition_pulse"
version = "0.1.0"
edition = "2024"
description = "A SENTINEL capability: one self-contained mechanic that contributes an authored schema, a semantic action, rollback state and causal facts without editing any central enum or the actor crate."

# ⚠ THE DEPENDENCY LIST IS THE PROOF.
#
# No `ambition_actors`, no `ambition_content`, no game. A capability that had to
# reach into the actor crate to exist would tell us the seams are not seams —
# so this one deliberately cannot, and the compiler enforces it.
#
# It sits ABOVE `ambition_runtime` on purpose: R1's recorded decision is that a
# domain BELOW the runtime has its rollback schema registered on its behalf
# (see `rollback/domains/vfx.rs`), and only a crate above it owns one directly.
# "A capability registers its own rollback state" is only testable up here.
[dependencies]
ambition_content_pack = { path = "../ambition_content_pack" }
ambition_causal = { path = "../ambition_causal", features = ["bevy"] }
ambition_input = { path = "../ambition_input" }
ambition_engine_core = { path = "../ambition_engine_core" }
bevy = { version = "0.18.1", default-features = false }
ron = { workspace = true }
serde = { workspace = true }

# ⚠ A DEV-DEPENDENCY, and that is the whole fix.
#
# The first version of this crate depended on `ambition_runtime` so its plugin
# could register its own rollback state — which dragged the entire simulation
# into a mechanic that uses none of it. It also broke the pattern the other two
# contributions already follow: a capability OFFERS a content schema and OFFERS
# a semantic action, and the composition installs them. Rollback is the same
# kind of thing and now behaves the same way.
#
# As a dev-dependency it stays out of `cargo tree --edges normal`, so the
# capability's real closure is foundations only — and the test that proves the
# registration works still runs.
[dev-dependencies]
ambition_runtime = { path = "../ambition_runtime" }
