[package]
name = "ambition_registry_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The protocol every canonical registry repeats: what counts as a registration's stable identity, how a second registration is classified (new / idempotent / conflict), and how rows become one canonical dump. Domain crates keep their keys, values, maps and policy."

[lib]
crate-type = ["rlib"]

# ⛔ DEPENDENCY-FREE ON PURPOSE. This sits below every registry in the
# workspace and must change rarely; a foundation crate that pulls Bevy in is a
# rebuild fanout for thirty crates every time it moves. Bevy adapters, if a
# shared one ever proves worth it, live in the owning crate.
[dependencies]
# (none — the policy row engine.ambition_registry_core-dependency-free keeps it so)
