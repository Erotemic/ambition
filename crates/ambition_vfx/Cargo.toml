[package]
name = "ambition_vfx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Reusable, content-free effect vocabulary: the Effect enum + EffectRequest seam + the generic executor, plus the world-anchored Hitbox damage-box component. A game's techniques emit these; the engine executes them. Extracted from ambition_platformer2d_actor_monolith."

[lib]
crate-type = ["rlib"]

[dependencies]
# Backend-neutral rollback declaration vocabulary only; no runtime/GGRS dependency.
ambition_platformer2d_core = { path = "../ambition_platformer2d_core" }
# ECS surface only (Component / Message / Commands / Entity / Name via prelude).
# No render/audio/windowing — this crate stays reusable and headless.
bevy = { version = "0.19.1", default-features = false }

# Geometry (Vec2 / Aabb) — the pure-logic foundation.
ambition_geometry = { path = "../ambition_geometry" }

# SfxId for FxRequest's OPTIONAL cue override. the effect's OWN cue is no
# longer named here: it is derived from the authored effect name by the
# presentation layer, because the bank already ships one `vfx.<family>.<row>`
# cue per authored row and a Rust table restating that could only drift.
ambition_sfx = { path = "../ambition_sfx" }
