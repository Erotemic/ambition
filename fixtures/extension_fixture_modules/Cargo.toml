[package]
name = "ambition_extension_fixture_modules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Test-only extension modules that the game does not link: built for wasm32-unknown-unknown and loaded by tests, to prove what a newly loaded module can add."

# Like `ambition_content_modules`: the SDK and the pure port values only.
[dependencies]
ambition_combat_port = { path = "../../crates/ambition_combat_port" }
ambition_extension_sdk = { path = "../../crates/ambition_extension_sdk" }
ambition_projectile_spec = { path = "../../crates/ambition_projectile_spec" }
bevy_math = { version = "0.19.1" }
