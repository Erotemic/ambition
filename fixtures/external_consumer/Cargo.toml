# The Phase-6 external-architecture proof (campaign doc §Phase 6): a consumer
# game that lives OUTSIDE the engine workspace — its own [workspace], its own
# lockfile, no workspace dependency table, no policy exemptions — so what
# compiles here is exactly what a third party gets from the `ambition_platformer2d`
# umbrella. The dependency rule is the same one the in-repo demos prove:
# `ambition_platformer2d` + `bevy`, nothing else (bevy only because component derives
# resolve `bevy_ecs` through the CONSUMER's manifest).
[package]
name = "outlander"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

# No `#[test]` in a bin entry point, so `cargo test` was compiling and LINKING a
# test harness for each of these against the full engine graph. Nothing was in
# them to run. (Compile-efficiency pass, 2026-07-31.)
[[bin]]
name = "outlander_headless"
path = "src/bin/headless.rs"
test = false
bench = false

[[bin]]
name = "outlander_dump"
path = "src/bin/dump.rs"
test = false
bench = false

# The windowed face. Feature-gated exactly like the in-repo demo shells: the
# default build stays headless-lean, and `--features visible` adds the render
# chain, the basic shell presentation, and the standard host input path.
[[bin]]
name = "outlander_visible"
path = "src/bin/visible.rs"
required-features = ["visible"]
test = false
bench = false

[features]
default = []
visible = [
    "ambition_platformer2d/visible",
    "ambition_platformer2d/basic_shell_presentation",
    "ambition_platformer2d/input",
    "bevy/default",
]

[dependencies]
# Slice H: capability edges are features now. Outlander DRAWS and its library /
# integration tests explicitly exercise the public rollback promise, so it asks
# for those two capabilities by name. What else still links is the carve's
# problem, not this manifest's. `fixtures/minimal_game` is the sentinel that asks
# for no rollback backend at all.
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = [
    "ambition_render",
    # Outlander exercises the public rollback promise in its library/tests.
    # Rollback is now an explicit backend capability rather than an unconditional
    # cost of naming the facade, so this consumer must ask for what it uses.
    "rollback",
] }
bevy = { version = "0.18.1", default-features = false }
