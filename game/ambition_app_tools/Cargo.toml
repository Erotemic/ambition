[package]
name = "ambition_app_tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ambition's non-game binaries: headless/RL drivers, trace replay, scene capture, previews."

# WHY THIS PACKAGE EXISTS, and it is not "the app crate got big".
#
# Cargo builds every `[[bin]]` of a package before running that package's
# integration tests, because a test may exec one through `CARGO_BIN_EXE_*`. That
# is correct and unavoidable — there is no flag for "build the test but not the
# bins". `ambition_app` had SEVEN bins and no test that execs any of them, so
# every filtered `cargo test -p ambition_app --test app_it` relinked all seven.
#
# MEASURED, after an `ambition_app` source edit:
#   lib alone 9.2s · lib + 7 bins 16.4s · lib + bins + `app_it` 21.7s
#   lib + `ambition_game_bin` only 10.8s
# so the six non-game binaries were 5.6s of a 21.7s answer — 26%, forever, on
# work nothing consumed.
#
# `ambition_game_bin` deliberately STAYS in `ambition_app`. It is 1.6s of the
# 7.2s and it is THE GAME: moving it would change how the game is launched to
# recover a fifth of the saving.
#
# and `required-features` was not the cheaper fix, though every one of these
# already carries it: they name `rl_sim` and `visible`, which are DEFAULT features
# the tests themselves need. The gate was never off during a test run.
#
# This package has no lib and no tests on purpose. It is a place for binaries to
# live, not a layer.

[features]
# `causal` must exist HERE or it silently stops existing. `rl_random_walker`
# has four `#[cfg(feature = "causal")]` arms; a feature the package does not
# declare is not an error, it is permanently FALSE — so the walker would have gone
# on building and quietly recorded nothing. Forwarded rather than redefined, so
# there is one switch and it is the app's.
#
# `game` is the composed game and everything a simulating or picture-taking
# command needs. Every bin but the offline reports requires it, and every
# launch descriptor names it (`--features game`, or
# `--features ambition_app_tools/game` on a workspace-wide lane). It is OFF by
# default, so `cargo run -p ambition_app_tools --bin item_report` builds the
# report with persistence alone.
#
# ⛔ `required-features` SKIPS a target that lacks its feature, tests and all,
# and says nothing. A workspace lane that forgets the feature is green over 25
# fewer targets: `scripts/run_tests.py` names it on each one
# (`WORKSPACE_FEATURES`). A bin added here must carry `required-features` too:
# without it a default build fails to find its optional dependencies.
#
# `sim` is the simulation family alone: the composed game with no window,
# no presentation features and no capture. A command that steps the game and
# prints what it did requires `sim`; one that takes a picture, plays a Smash
# match or opens a menu requires `game`, which includes `sim`. Selecting both
# (any workspace lane) unions them, as Cargo always does.
default = []
sim = [
    "dep:ambition_app",
    "ambition_app/rl_sim",
    "dep:ambition_platformer2d",
    "ambition_platformer2d/rollback",
    "ambition_platformer2d/ldtk",
    "ambition_platformer2d/ambition_portal2d",
    "ambition_platformer2d/dialogue",
    "dep:ambition_sim_harness",
    "dep:bevy",
    "dep:ambition_content",
    "dep:avian2d",
]
game = [
    "sim",
    "ambition_app/desktop_dev",
    "ambition_platformer2d/all_capabilities",
    "ambition_platformer2d/capture",
    "ambition_sim_harness/capture",
    "dep:ambition_menu_kaleidoscope",
    "dep:ambition_demo_smash",
    "ambition_demo_smash/render",
    "dep:ambition_demo_smash_app",
    "dep:image",
]
causal = ["game", "ambition_app/causal"]
# Tracy zones and Bevy's render diagnostics, forwarded for the SAME reason
# `causal` is: a feature this package does not declare is not an error here, it
# is permanently FALSE. `scripts/measure/profile_desktop.sh` passes `--features profile`
# to whatever `run_game.sh` resolves to, and without this line the one command
# that profiles a live Smash match would fail at cargo with "package
# `ambition_app_tools` does not have feature `profile`".
profile = ["game", "ambition_app/profile"]
# Forwarded for the same reason as `profile`: `profile_desktop.sh --perf-probe`.
perf_probe = ["game", "ambition_app/perf_probe"]

[dependencies]
# The pure move/entity value vocabulary and its authoring primitives.
# ⭐ DIRECT, not through the engine facade: authoring a move is a value
# computation, and I1's whole point is that it must not pull the graph.
ambition_entity_catalog = { path = "../../crates/ambition_entity_catalog" }
# The save format and its reader, from their owner: the offline reports read
# a save file without the game.
ambition_persistence = { path = "../../crates/ambition_persistence" }
# Without its defaults: `sim` selects the no-window simulation (`rl_sim`),
# and `game` adds the desktop development persona the other commands had.
ambition_app = { path = "../ambition_app", default-features = false, optional = true }
# The cube menu's camera marker, so `--include-ui` photographs an open menu.
ambition_menu_kaleidoscope = { path = "../ambition_menu_kaleidoscope", optional = true }
# Without its defaults: `sim` takes the capabilities a stepping command reads,
# and `game` adds every capability (the renderer among them) for the
# picture-taking and menu commands.
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, optional = true }
# ⭐ THE MOVE-EXERCISE AND CAPTURE MACHINERY, which used to be a `#[path]`-included
# source file in `src/bin/support/`. `capture` is opt-in on the harness so a test
# or RL driver keeps paying for no renderer; a picture-taking tool asks for it.
ambition_sim_harness = { path = "../../crates/ambition_sim_harness", optional = true }
bevy = { version = "0.19.1", default-features = false, features = ["ui_api"], optional = true }
# `capture_scene` stages real rooms and `preview_vanity_card` plays a real shell
# segment, so both reach the content crate directly rather than through the app.
ambition_content = { path = "../ambition_content", optional = true }
# `shark_ride_probe` seats a real smash match and drives a real press, which is
# the demo's own vocabulary (its roster builder, its route id).
ambition_demo_smash = { path = "../ambition_demo_smash", optional = true }
ambition_demo_smash_app = { path = "../ambition_demo_smash_app", optional = true }
serde_json = "1"
ron = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
clap = { workspace = true }
libc = "0.2"
avian2d = { version = "0.7", optional = true }

# ⛔⛤ **`test = false` ON A TARGET WITH `#[test]` ARMS IS A GUARD THAT DOES NOT
# EXIST.** MEASURED 2026-09-12: four bins here carried it while holding 23 live
# arms between them, and `--rust` compiled every one of them (their clippy
# warnings are in the lane log) without executing a single arm. One of the
# silenced arms was a bounds-vs-hull contact regression this recorder is tuned
# against. ⇒ If a target has tests, it runs them; if it genuinely has none,
# `test = false` is a build-time saving and not a decision about coverage.
[[bin]]
name = "shark_ride_probe"
required-features = ["game"]
path = "src/bin/shark_ride_probe.rs"
test = false

[[bin]]
name = "trap_probe"
required-features = ["game"]
path = "src/bin/trap_probe.rs"
test = false

# The up-B's twin. ⛔ NOT a mode on `trap_probe`: the two moves share a stage
# and a driver (`src/probe_stage.rs`, included by both) and share nothing about
# what is worth printing — one is five stages under the boards, the other is six
# clauses on a rope.
[[bin]]
name = "wire_probe"
required-features = ["game"]
path = "src/bin/wire_probe.rs"
test = false

# A7's agent surface: what a save file says about its items.
[[bin]]
name = "item_report"
path = "src/bin/item_report.rs"
test = false

[[bin]]
name = "capture_scene"
required-features = ["game"]
path = "src/bin/capture_scene.rs"
bench = false

[[bin]]
name = "smash_match_profile"
required-features = ["game"]
path = "src/bin/smash_match_profile.rs"
test = true

[[bin]]
name = "headless"
required-features = ["sim"]
path = "src/bin/headless.rs"
test = false

# Fight discovery: run a boss fight headlessly under a few player policies and
# write its choreography and a FightReport-shaped summary (boss-design.md §4).
[[bin]]
name = "fight_discovery"
required-features = ["sim"]
path = "src/bin/fight_discovery.rs"
bench = false

# Room census: run an encounter room headlessly and measure what its bodies do
# (ceiling contact, vertical dithering, sounds by kind and stutter).
[[bin]]
name = "room_census"
required-features = ["sim"]
path = "src/bin/room_census.rs"
bench = false

# Inspect geometry: what each installed geometry provider says a room holds
# (GOBS-1), as JSON; the answer F1's Observed Geometry layer draws.
[[bin]]
name = "inspect_geometry"
required-features = ["game"]
path = "src/bin/inspect_geometry.rs"
bench = false

# Extension inspect: the procedural extension host's ports, entries, code,
# generation and per-body records, as text (fast-iteration I7 item 5).
[[bin]]
name = "extension_inspect"
required-features = ["game"]
path = "src/bin/extension_inspect.rs"
test = false
bench = false

[[bin]]
name = "rl_random_walker"
required-features = ["sim"]
path = "src/bin/rl_random_walker.rs"
test = false
bench = false

[[bin]]
name = "rl_smoke"
required-features = ["sim"]
path = "src/bin/rl_smoke.rs"
test = false
bench = false

[[bin]]
name = "trace_replay"
required-features = ["sim"]
path = "src/bin/trace_replay.rs"
bench = false

[[bin]]
name = "preview_vanity_card"
required-features = ["game"]
path = "src/bin/preview_vanity_card.rs"
test = false
bench = false

# The moveset inspector's data source. It boots the composed host and reports
# what the SHIPPED cast resolves to, which is the only version of the numbers a
# balance decision can be made against.
[[bin]]
name = "moveset_export"
required-features = ["game"]
path = "src/bin/moveset_export.rs"
bench = false

# The engine-take recorder. A frame-data table reports what a move DECLARES; a
# take reports what the engine DID with it.
[[bin]]
name = "moveset_takes"
required-features = ["game"]
path = "src/bin/moveset_takes.rs"
# ⛔⛤ `test = false` USED TO BE HERE, AND IT MEANT AN ENTIRE TEST MODULE RAN IN
# NO LANE. MEASURED 2026-09-12: `--rust` compiled this bin (its clippy warnings
# are in the log) and executed NONE of its arms, including the bounds-vs-hull
# contact regression that predates this line. A recorder this file is tuned
# against is exactly the thing whose guards have to run.
bench = false

[[bin]]
name = "zero_time_capture_spike"
required-features = ["game"]
path = "src/bin/zero_time_capture_spike.rs"

[[bin]]
name = "moveset_render"
required-features = ["game"]
path = "src/bin/moveset_render.rs"

# The KO-envelope instrument: a launcher-pulse census over the prepared moveset
# graph, then a stage-outcome probe over the same launchers.
#
# ⛔⛤ NO `test = false` HERE, DELIBERATELY. This target carries live `#[test]`
# arms — including the ones that replace four failed source-parsing censuses —
# and the guard above this file's first `[[bin]]` records what that line costs:
# four bins carried it while holding 23 arms between them and NOT ONE executed.
[[bin]]
name = "ko_envelope"
required-features = ["game"]
path = "src/bin/ko_envelope.rs"
bench = false

# How each Smash fighter MOVES (run, hops, falls, rolls, dodges), beside
# Ultimate's cast from `docs/related-work/data/`. Observational; no arms.
[[bin]]
name = "fighter_motion"
required-features = ["game"]
path = "src/bin/fighter_motion.rs"
test = false

[[bin]]
name = "render_room_geometry"
required-features = ["game"]
path = "src/bin/render_room_geometry.rs"
test = false

[[bin]]
name = "smash_cpu_report"
required-features = ["game"]
path = "src/bin/smash_cpu_report.rs"
test = false

# Bins cargo used to discover on its own. Discovery gives a bin no
# `required-features`, so with `game` off by default each needs its row.
[[bin]]
name = "officer_probe"
required-features = ["game"]
path = "src/bin/officer_probe.rs"

[[bin]]
name = "whiff_drill"
required-features = ["game"]
path = "src/bin/whiff_drill.rs"

[[bin]]
name = "project_export"
required-features = ["game"]
path = "src/bin/project_export.rs"
