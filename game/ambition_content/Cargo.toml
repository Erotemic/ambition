[package]
name = "ambition_content"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ambition's named game content: quests, bosses, items, dialogue, intro, banter."
autotests = false

[features]
default = []
# Forwarders: the cfg(feature = "...") gates inside this crate's code key off
# OUR feature names; each forwards to the matching ambition_platformer2d_actor_monolith machinery
# feature so a mismatched combination is a compile error, never a silent
# missing-registration.
# The runtime's portal edge offers the held portal pair port and the light
# line port, which GNU-ton's conductor asks for (`ambition.portal.held_pair`,
# `ambition.portal.light_line`).
portal = ["ambition_platformer2d_actor_monolith/portal", "ambition_platformer2d_runtime/portal"]
portal_render = ["portal", "dep:ambition_portal2d_presentation"]
ui = ["ambition_platformer2d_actor_monolith/ui", "ambition_dialog/ui", "dep:bevy_yarnspinner", "dep:yarnspinner"]
audio = ["ambition_audio/kira"]
# Embed the LDtk world JSON into the binary (web / Android / bundled builds
# + the desktop disk-failure fallback). Forwards to the machinery feature so
# the loader's embedded paths light up together.
static_map = ["ambition_platformer2d/static_map"]
# Embed GENERATED content RON into the binary, the same way `static_map` embeds
# the world JSON. OFF by default so desktop development reads it off disk: an
# `include_str!` is a compilation input, so embedding the tool-generated music
# registry made every `scripts/regen/music.sh` rebuild this crate and everything
# downstream of it. Turn this ON wherever there is no filesystem to read from
# (web, Android) or the binary ships without the source tree (Steam Deck).
static_content = []
# The LDtk runtime that paints this game's rooms, which the provider installs
# where the host has a render app, and the startup collection it loads.
ldtk_runtime = ["ambition_platformer2d_assets/ldtk_runtime", "ambition_platformer2d_ldtk/ldtk_runtime", "dep:bevy_asset_loader", "bevy/bevy_render"]
# The LDtk world watcher's status names Bevy's file watching (the app's
# `dev_hot_reload` forwards here).
dev_hot_reload = []
# The Avian debris that this game's breakables and defeated enemies throw,
# which the provider installs where the App presents.
physics_debris = ["ambition_platformer2d/physics_debris"]

[build-dependencies]
# `build.rs` embeds each source `assets/pack.ron` declares, under
# `static_content` (`ambition_content_pack::embed`).
ambition_content_pack = { path = "../../crates/ambition_content_pack" }
# `build.rs` reads the world list (`assets/data/worlds.ron`) under `static_map`.
ron = { workspace = true }
serde = { workspace = true }

[dependencies]
ambition_platformer2d_assets = { path = "../../crates/ambition_platformer2d_assets" }
ambition_platformer2d_items = { path = "../../crates/ambition_platformer2d_items" }
ambition_platformer2d_session = { path = "../../crates/ambition_platformer2d_session" }
# Ambition's own schemas (`ambition_rules`), beside the engine's. A crate with
# no Bevy, so the package guard's check binary builds in seconds.
ambition_content_schemas = { path = "../ambition_content_schemas" }
# Ambition's procedural extension modules (the echo fan, fast-iteration I4),
# declared to the host by `bosses::specials`.
ambition_content_modules = { path = "../ambition_content_modules" }
ambition_extension_host = { path = "../../crates/ambition_extension_host" }
# `content_pack`: this crate's own content goes through the compiler, and the facade's
# `content::engine_schemas()` is the ONE list of engine-owned schemas it compiles against.
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities", "content_pack"] }
# The fighter specials its cast authors (a counter, a spring, a portal pair,
# ...), installed for their keys without the Smash demo.
ambition_fighter_specials = { path = "../ambition_fighter_specials" }
# Baseline machinery features: the sandbox lib was never built fully bare
# (ldtk/input/portal code is not end-to-end cfg-gated), so the content crate
# pins the same always-on baseline every persona used pre-split.
ambition_dialog = { path = "../../crates/ambition_dialog", default-features = false }
ambition_conversation = { path = "../../crates/ambition_conversation" }
ambition_boss_encounter = { path = "../../crates/ambition_boss_encounter" }
# The LDtk backend, named directly. This crate reached it through the actor
# monolith's `ldtk_world` compatibility facade, whose own doc says callers
# should repoint to the owning crate; the edge was already here transitively.
ambition_platformer2d_ldtk = { path = "../../crates/ambition_platformer2d_ldtk", default-features = false }
# The MOUNT PAIR's `Mountable`, carved out of the monolith (D33): dormancy asks
# whether a body is somebody's mount before it retires it.
ambition_mount = { path = "../../crates/ambition_mount" }
ambition_platformer2d_actor_spawn = { path = "../../crates/ambition_platformer2d_actor_spawn" }
ambition_platformer2d_actor_monolith = { path = "../../crates/ambition_platformer2d_actor_monolith", default-features = false, features = [
    "input",
    "portal",
] }
# The pressed collectible (D33, 2026-09-03): the portal adapters equip/unequip
# the gun through its held-spec road and order against its throw.
ambition_held_items = { path = "../../crates/ambition_held_items", features = ["portal"] }
ambition_body_seed = { path = "../../crates/ambition_body_seed" }
ambition_sprite_sheet = { path = "../../crates/ambition_sprite_sheet" }
# `content_pack`: the `projectile_visuals` schema Ambition's looks are read through.
ambition_projectiles = { path = "../../crates/ambition_projectiles", features = ["content_pack"] }
ambition_render = { path = "../../crates/ambition_render" }
# Identity read-model for the content-owned actor overlay presentation
# (the puppy-slug deep-dream pass reads dream participation from it).
ambition_sim_view = { path = "../../crates/ambition_sim_view" }
ambition_ui_nav = { path = "../../crates/ambition_ui_nav" }
ambition_combat = { path = "../../crates/ambition_combat", features = ["content_pack"] }
ambition_encounter = { path = "../../crates/ambition_encounter" }
ambition_encounter_features = { path = "../../crates/ambition_encounter_features" }
# N3.1: this crate's boss specials hold SIM STATE, so they register their own
# snapshot codecs (`SnapshotRegistry` is a resource). netcode.md: "each sim crate
# registers its components' serialization."
ambition_platformer2d_runtime = { path = "../../crates/ambition_platformer2d_runtime" }
ambition_cutscene = { path = "../../crates/ambition_cutscene", features = ["content_pack"] }
ambition_sfx = { path = "../../crates/ambition_sfx" }
ambition_vfx = { path = "../../crates/ambition_vfx" }
ambition_time = { path = "../../crates/ambition_time" }
ambition_audio = { path = "../../crates/ambition_audio", features = ["content_pack"] }
ambition_platformer2d_shared_tangle = { path = "../../crates/ambition_platformer2d_shared_tangle" }
# `MovingPlatformSet` + `world_with_sandbox_solids` — the composited collision
# world the portal host adapter and the arena-gate tests read (R3).
ambition_platformer2d_world = { path = "../../crates/ambition_platformer2d_world" }
ambition_portal2d = { path = "../../crates/ambition_portal2d" }
ambition_portal2d_presentation = { path = "../../crates/ambition_portal2d_presentation", optional = true }
ambition_input = { path = "../../crates/ambition_input" }
ambition_platformer2d_core = { path = "../../crates/ambition_platformer2d_core" }
ambition_entity_catalog = { path = "../../crates/ambition_entity_catalog" }
ambition_resource_spec = { path = "../../crates/ambition_resource_spec" }
ambition_characters = { path = "../../crates/ambition_characters", features = ["content_pack"] }
# The content compiler. This provider LOADS through it: the bytes the
# validator judged and the bytes the game runs are one read.
ambition_content_pack = { path = "../../crates/ambition_content_pack" }
ambition_persistence = { path = "../../crates/ambition_persistence", features = ["content_pack"] }
ambition_interaction = { path = "../../crates/ambition_interaction" }
ambition_items = { path = "../../crates/ambition_items", features = ["content_pack"] }
bevy = { version = "0.19.1", default-features = false, features = ["ui_api"] }
bevy_yarnspinner = { version = "0.9", optional = true }
bevy_asset_loader = { version = "0.27", optional = true }
# The Yarn compiler bevy_yarnspinner runs, for checking a saved dialogue edit
# whole before the running project takes it (`content_watch`).
yarnspinner = { version = "0.9", optional = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
# `test_item_catalog`: the shipped `items.ron` as a test fixture.
ambition_items = { path = "../../crates/ambition_items", features = ["content_pack", "test-support"] }
# The echo fan's wasm parity arm builds the module crate for wasm32 and runs it.
ambition_extension_sdk = { path = "../../crates/ambition_extension_sdk" }
ambition_extension_wasm = { path = "../../crates/ambition_extension_wasm" }
# `bosses/conduct_trigger_tests.rs` reads the conduct trigger through a probe module.
ambition_boss_special_port = { path = "../../crates/ambition_boss_special_port" }
# Compiler-confirmed unused under default AND --all-features at [dependencies]
# (-W unused_crate_dependencies, docs/planning/triage/unused-dependency-census.md,
# 2026-09-18): every use (encounters/tests.rs, intro/tests.rs, intro/route_state/tests.rs)
# is inside a #[cfg(test)] module.
serde_json = "1"
# Downstream crates are unaffected; only content's dev/test profile gets the feature.
ambition_content = { path = ".", features = ["portal"] }
# `tests/puppy_slug_forced_seat.rs` is an INTEGRATION test, so it is its own
# crate and compiles WITHOUT the library's `cfg(test)`. It needs the gated raw
# closer, and `[dependencies]` above deliberately does not carry the feature:
# a dev-dependency's features do not reach a normal build under resolver 2, so
# the bypass stays absent from anything that ships.
ambition_characters = { path = "../../crates/ambition_characters", features = ["test-support"] }
# The CLI's schema composition, so `content_pack_registry` can check it against the one the GAME
# compiles with. Test-only: the CLI links no content and no renderer, so this costs the dev
# profile nothing it does not already have.
ambition_content_cli = { path = "../../crates/ambition_content_cli" }
# A temp content ROOT for the fast-iteration witnesses: `reload.rs`'s directory
# road must be exercised against a directory that did not exist when this binary
# was built, and a guard whose subject mutates the repository tree is the failure
# this crate has already paid for once.
tempfile = "3"
# The standalone Yarn compiler (same version bevy_yarnspinner pulls) for the
# `yarn_compile` guard test — compiles the authored sources the way the
# game's asset loader would at startup.
yarnspinner = "0.9"

# ONE aggregated integration-test binary instead of 6. See tests/content_it.rs.
[[test]]
name = "content_it"
path = "tests/content_it.rs"
