collections:
  # The game's sprites: every target the renderer registers (its discovery:
  # `targets/<category>/` modules and `configs/`), except the ones named here,
  # each with the reason it is not shipped. A new target is published by the
  # next regeneration without being listed anywhere; a target named here is
  # never published (renderer `tests/test_runtime_collection.py`).
  runtime:
    except:
      player_combat_review: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
