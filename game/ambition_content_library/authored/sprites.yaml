collections:
  # The game's sprites: every target the renderer registers (its discovery:
  # `targets/<category>/` modules and `configs/`), except the ones named here,
  # each with the reason it is not shipped. A new target is published by the
  # next regeneration without being listed anywhere; a target named here is
  # never published (renderer `tests/test_runtime_collection.py`).
  runtime:
    except:
      player_combat_review: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      player_social_review: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      player_traversal_review: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      sandbag_armored_review: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      sandbag_full_review: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_archivist: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_caster: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_diver: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_engineer: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_medic: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_miner: "Review sheet (configs/review): every action drawn for the art review; the game draws this body from its runtime target."
      robot_heavy: "A multi-variant rig (bastion, arsenal, ...); the bare name is not a character. Its variants ship as catalog entries once the publisher installs them (see `npc_robot_heavy` in character_catalog.ron)."

# Sheets whose baked pages the game still reads, so a part-first publish
# (`build_sheet(parts=True)`) paints them as before. Keyed by sheet name: the
# file stem before `_spritesheet`. Boss art: the boss road
# (`ambition_sprite_sheet::boss`) loads a boss sheet's pages and the room
# barrier waits on them, and most boss sheets name no character to draw their
# parts (`BossSheetSpec::parts`); every file in `data/boss_art_keys.ron` is
# here until bosses are drawn page-less (PF2b,
# `docs/planning/engine/part-first-publication.md`).
baked_pages:
  gradient_sentinel_boss: "Boss art (boss_art_keys.ron); the boss road reads its pages (PF2b)."
  clockwork_warden_boss: "Boss art (boss_art_keys.ron); the boss road reads its pages (PF2b)."
