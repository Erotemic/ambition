[package]
name = "ambition_content_schemas"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The schemas Ambition's own pack names beside the engine's. The check binary that composes them with the content CLI is `ambition_content_check`, above this library."

[dependencies]
ambition_content_pack = { path = "../../crates/ambition_content_pack" }
serde = { workspace = true }
ambition_htn = { path = "../../crates/ambition_htn" }
# The gate network lowers into the world capability's numbered catalog.
ambition_platformer2d_world = { path = "../../crates/ambition_platformer2d_world" }

[dev-dependencies]
# The schema tests write their fixtures as the authored RON.
ron = { workspace = true }
