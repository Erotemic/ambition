[package]
name = "ambition_demo_mary_o"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tiny Mary-O demo content home used as an oracle for the Ambition facade crate."

[features]
default = []
# Embed the content pack's texts (`content_pack!`). Off by default, so a
# development build reads them off disk and a tuning edit needs no Rust build.
# Turn it on where there is no source tree to read (web, Android, a bundle).
static_content = []

[build-dependencies]
# `build.rs` embeds each source `assets/pack.ron` declares, under
# `static_content` (`ambition_content_pack::embed`).
ambition_content_pack = { path = "../../crates/ambition_content_pack" }

[dependencies]
# The pure move/entity value vocabulary and its authoring primitives.
# ⭐ DIRECT, not through the engine facade: authoring a move is a value
# computation, and I1's whole point is that it must not pull the graph.
ambition_entity_catalog = { path = "../../crates/ambition_entity_catalog" }
# Its enemy brains, as extension modules: an edit to one compiles that crate
# alone, and a running game loads the file (`MaryORulesPlugin` links them).
ambition_demo_mary_o_modules = { path = "../ambition_demo_mary_o_modules" }
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities", "content_pack"] }
# A content crate that defines its own ECS components/resources cannot reach
# bevy's derive macros through `ambition_platformer2d::bevy` — they resolve `bevy_ecs` through
# the CONSUMER's manifest, so a re-export does not satisfy them. The E9 oracle's
# real claim: a downstream game names `ambition_platformer2d` + `bevy`, and NOTHING ELSE.
bevy = { version = "0.19.1", default-features = false }
# The demo's own pack schema (`rules.rs`) derives its reader.
serde = { workspace = true }
