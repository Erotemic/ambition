id: castle_crash_override
title: Castle Crash Override
seed: 2026101117
description: A straight-ahead castle-rock loop led by Salamander grand piano, not by bass or organ. Original
  D-F-A / Eb-D-C# chromatic castle hook over D minor, Eb and A7 power chords; two ferocious guitar solo sections
  with hand-authored bend/vibrato envelopes; direct thematic return, no contrasting B theme. Six 8-bar sections;
  48 bars total.
