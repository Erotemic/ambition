notes:
- 'v4 user direction: Salamander grand piano is the MAIN melodic voice. Guitar is deliberately foregrounded
  only during the two solo sections. Bass is a quiet root-and-fifth foundation, not a counter-melody.'
- 'Remove Secret Passage entirely: no F/C/Bb/A contrasting passage or hidden_walkway material. The castle hook
  repeats without progressive instrumentation or an unrelated melodic detour.'
- 'Guitar bends follow Carry the One MusicIR v3 technique: clip-local pitch_bend automation with a -1365 to
  0 scooped attack, smooth 1/64 resolution, and short +/- pitchbend vibrato. The user must verify actual bends
  in the workstation render.'
- Keep two stereo guitar chug groups, Emily single-note lead with Guitarix drive, Big Rusty drumkit, atmospheric
  organ stabs, and supportive Growlybass. All content remains original, not a Nintendo melody transcription.
