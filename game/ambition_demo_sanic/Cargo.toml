[package]
name = "ambition_demo_sanic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tiny Sanic-style demo content home used as an oracle for the Ambition facade crate."

[features]
default = []
# Embed the content pack's texts (`content_pack!`). Off by default, so a
# development build reads them off disk and a tuning edit needs no Rust build.
# Turn it on where there is no source tree to read (web, Android, a bundle).
static_content = []
# The pack check binary (`sanic_content_check`): the content CLI with this demo's
# own schemas. Off by default: the demo never links the CLI.
content_check = ["ambition_platformer2d/content_check"]

[build-dependencies]
# `build.rs` embeds each source `assets/pack.ron` declares, under
# `static_content` (`ambition_content_pack::embed`).
ambition_content_pack = { path = "../../crates/ambition_content_pack" }

[dependencies]
# The pure move/entity value vocabulary and its authoring primitives.
# ⭐ DIRECT, not through the engine facade: authoring a move is a value
# computation, and I1's whole point is that it must not pull the graph.
ambition_entity_catalog = { path = "../../crates/ambition_entity_catalog" }
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities", "content_pack", "portal", "portal_ldtk"] }
# The E9 oracle's asterisk, paid explicitly. A content crate that defines its own
# ECS components/resources CANNOT reach bevy's derive macros through
# `ambition_platformer2d::bevy` — they resolve `bevy_ecs` through the CONSUMER's manifest, so a
# re-export does not satisfy them (found while landing refactor-chain R1; logged in
# dev/journals/code_smells.md). The oracle's real claim is therefore: a downstream
# game names `ambition_platformer2d` + `bevy`, and NOTHING ELSE. It still holds — this file is
# the proof.
bevy = { version = "0.19.1", default-features = false }
# The demo's own pack schema (`rules.rs`) derives its reader.
serde = { workspace = true }

# Check this demo's pack without a Rust build of the game: the content CLI,
# with the schemas this demo owns beside the engine's.
#     cargo run -p ambition_demo_sanic --features content_check --bin sanic_content_check -- game/ambition_demo_sanic/assets
[[bin]]
name = "sanic_content_check"
path = "src/bin/sanic_content_check.rs"
required-features = ["content_check"]
test = false
bench = false
