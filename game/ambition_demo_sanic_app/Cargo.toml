[package]
name = "ambition_demo_sanic_app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Sanic demo's thin SHELL: foundation + PlatformerEnginePlugins + PlatformerHostPlugins + the demo's content and rules crates. Playbook exit 3, executable."
autotests = false

[[bin]]
name = "sanic_demo"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Draw the world AND make it playable. Adds the engine's generic presentation face
# (OV1), the renderer's `visible` chain, AND the standard host input path (`input`)
# — a windowed demo that ignored the keyboard would not be a playable-persona demo.
# Without it the shell steps the sim headlessly (`tests/exit_3.rs`, the `sanic_demo`
# bin default).
# Offscreen capture: the `capture_sanic` binary. Implies `visible` and adds the
# engine's capture module + its PNG encoder. Off by default so nothing that ships
# links an encoder.
capture = ["visible", "ambition_platformer2d/capture"]
visible = ["ambition_platformer2d/visible", "ambition_platformer2d/basic_shell_presentation", "ambition_platformer2d/audio", "input", "dep:bevy_kira_audio"]
# Folded into `visible` above so the windowed binary is interactive; also usable alone for the
# headless `tests/standard_input_path.rs` proof.
input = ["ambition_platformer2d/input"]

[dependencies]
# The engine, host, and vocabulary — through the ONE umbrella surface. A demo app
# depends on `ambition_platformer2d`, never on `ambition_app`. That is the demo gate.
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities"] }
# The demo's own content + rules. The shell names nothing else.
ambition_demo_sanic = { path = "../ambition_demo_sanic" }
# Bevy's derives cannot be reached through a re-export (see the content crate's
# manifest). The shell needs none, but `App`/`Update` come from here.
bevy = { version = "0.19.1", default-features = false }
bevy_kira_audio = { version = "0.26", default-features = false, features = ["ogg"], optional = true }

# ONE aggregated integration-test binary instead of 11. See tests/sanic_it.rs.
[[test]]
name = "sanic_it"
path = "tests/sanic_it.rs"

# `required-features`, or `cargo check --all-targets` builds this against a
# crate whose windowed builder is behind `visible`.
[[bin]]
name = "capture_sanic"
path = "src/bin/capture_sanic.rs"
required-features = ["capture"]
