[package]
name = "ambition_demo_smash"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Stocks-based platform-fighter demo. The first consumer of the S4 stocks loop, and the oracle for whether a stocks game is expressible through the facade."

[features]
default = []
# Embed the content pack's texts (`content_pack!`). Off by default, so a
# development build reads them off disk and a tuning edit needs no Rust build.
# Turn it on where there is no source tree to read (web, Android, a bundle).
static_content = []
# The pack check binary (`smash_content_check`): the content CLI with this demo's
# own schemas. Off by default: the demo never links the CLI.
content_check = ["ambition_platformer2d/content_check"]

[build-dependencies]
# `build.rs` embeds each source `assets/pack.ron` declares, under
# `static_content` (`ambition_content_pack::embed`).
ambition_content_pack = { path = "../../crates/ambition_content_pack" }

[dependencies]
serde = { workspace = true }
# The pure move/entity value vocabulary and its authoring primitives.
# ⭐ DIRECT, not through the engine facade: authoring a move is a value
# computation, and I1's whole point is that it must not pull the graph.
ambition_entity_catalog = { path = "../../crates/ambition_entity_catalog" }
ambition_resource_spec = { path = "../../crates/ambition_resource_spec" }
# Its specials that are extension modules: an edit to one compiles that crate
# alone (`ambition_demo_smash_modules`).
ambition_demo_smash_modules = { path = "../ambition_demo_smash_modules" }
# The specials more than one game authors, installed once whoever asks first.
ambition_fighter_specials = { path = "../ambition_fighter_specials" }
# Authored effect params round-trip through the `ParamValue` seam.
# The E9 oracle rule, unchanged: `ambition_platformer2d` + `bevy` and nothing else. If authoring
# a STOCKS match needs a type the umbrella does not re-export, that is an engine leak and it
# fails to compile HERE, which is the point. A game that never validates its content still must
# not — that is why the feature exists.
# ⛔⛔ `portal` IS NAMED EXPLICITLY AND IS NOT IN `all_capabilities`. That list
# turns on the optional `ambition_portal2d` DEPENDENCY; the `portal` FEATURE is
# what installs `PortalSchedulePlugin`, and they are not the same switch.
# ⇒ Without it this crate still COMPILED — `PlacedPortal` is a type, and
# `open_authored_portal_pairs` spawns one happily — but nothing simulated a
# transit, so Alice's portal recovery opened two apertures a fighter fell
# straight through. Measured 2026-09-05: `ambition_app` had the feature and
# `ambition_demo_smash_app` did not, so the same authored move worked in the
# shipped game and was inert in the standalone demo.
# ⚠ This crate REGISTERS those systems unconditionally, so the requirement
# belongs here rather than on each app that composes it.
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities", "content_pack", "portal"] }
bevy = { version = "0.19.1", default-features = false }

[dev-dependencies]
# The riposte's loaded-file arm builds the module crate for wasm32 and runs it
# (`riposte_tests`).
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["wasm_modules"] }

# Check this demo's pack without a Rust build of the game: the content CLI,
# with the schemas this demo owns beside the engine's.
#     cargo run -p ambition_demo_smash --features content_check --bin smash_content_check -- game/ambition_demo_smash/assets
[[bin]]
name = "smash_content_check"
path = "src/bin/smash_content_check.rs"
required-features = ["content_check"]
test = false
bench = false
