[package]
name = "ambition_demo_twintrack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "TwinTrack: a character-driven 2D special-relativity plaza and teaching prototype."
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
visible = [
    "bevy/bevy_gizmos",
    "bevy/2d_bevy_render",
    "bevy/bevy_pbr",
    "bevy/bevy_text",
    "bevy/bevy_window",
]

[dependencies]
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities", "relativity"] }
bevy = { version = "0.19.1", default-features = false }
