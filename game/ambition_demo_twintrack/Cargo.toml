[package]
name = "ambition_demo_twintrack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "TwinTrack: a 2D special-relativity signal-course proof of concept."
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
visible = ["bevy/bevy_gizmos"]

[dependencies]
ambition_platformer2d = { path = "../../crates/ambition_platformer2d", default-features = false, features = ["all_capabilities", "relativity"] }
bevy = { version = "0.18.1", default-features = false }
