[package]
name = "ambition_menu_opinions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Optional video and rebind pages for the basic Ambition game shell."

[features]
default = []
video = ["dep:ambition_settings_menu", "dep:ambition_game_shell", "dep:ambition_persistence"]
rebind = ["ambition_input/input", "dep:ambition_game_shell", "dep:ambition_persistence"]

[dependencies]
ambition_game_shell = { path = "../../crates/ambition_game_shell", features = ["basic_presentation"], optional = true }
ambition_input = { path = "../../crates/ambition_input" }
ambition_persistence = { path = "../../crates/ambition_persistence", optional = true }
ambition_settings_menu = { path = "../../crates/ambition_settings_menu", optional = true }
bevy = { version = "0.19.1", default-features = false }
