# ADR 0024 authority model: every production write to authoritative body pose
# belongs to a NAMED authority — the movement kernel (continuous integration),
# `transit_body` (discrete teleports), `carry_body`/`constrain_body_pose`
# (external kinematic constraints), or a domain integrator (projectiles, free
# items, the portal core's aperture transit). A bare `kin.pos = …` anywhere
# else is an authority leak: it moves a body without reconciling contacts,
# attachment, model-private state, or the §3.1 motion record.
[[policy]]
id = "engine.pose-writes-are-authority-only"
scope = "engine"
kind = "forbidden-source-reference"
owners = ["ambition_platformer2d_core", "ambition_platformer2d_actor_monolith"]
watch_paths = ["crates", "game"]
rationale = "ADR 0024 authority model: body pose writes go through the kernel, transit_body, carry_body/constrain_body_pose, or a sanctioned domain integrator — never a bare field write. SECOND KNOWN BLIND SPOT (2026-08-16): it cannot tell a LIVE body from a PRE-SPAWN SEED. `ActorClusterSeed` has a `kin` field and no entity, no MotionModel and no frame, so `transit_body` cannot be called on it at all and there is no authority to route through — yet `seed.kin.pos = ` reads identically to relocating a simulated body. The one such site now goes through `ActorClusterSeed::place_at`, which is worth having on its own merits (the placement is TWO coupled fields), but a future seed constructor will hit this again and the honest answer there is a construction seam, not a waiver."
source_doc = "docs/adr/0024-frame-aware-unified-movement-kernel.md"
severity = "error"
production_only = true
skip_tests = true
roots = ["crates", "game"]
forbid = [
    "kin.pos = ", "kin.pos += ", "kin.pos -= ",
    "kinematics.pos = ", "kinematics.pos += ", "kinematics.pos -= ",
    "kin.pos.x = ", "kin.pos.y = ", "kinematics.pos.x = ", "kinematics.pos.y = ",
    # `body.` TOO. This rule matches the RECEIVER'S NAME, not its type, so a
    # `BodyKinematics` bound to any other identifier is invisible to it. The
    # TwinTrack demo bound one as `body` and relocated the traveler with a bare
    # `body.pos = ` for two days; a human reviewer found it, this did not.
    # `body` is the one other name actually in use — every non-test hit is
    # already inside a sanctioned skip path below — but see the rationale: the
    # blind spot is the shape of the check, and closing one name is not closing it.
    # LEADING SPACE, deliberately. Bare `body.pos` also matches the TAIL of
    # `player_body.pos`, which is how `camera_snapshot.rs` — writing a SimView
    # snapshot, not a body — turned up as two violations on the first run. An
    # indented statement always has whitespace before it; a suffix never does.
    " body.pos = ", " body.pos += ", " body.pos -= ",
    " body.pos.x = ", " body.pos.y = ",
]
skip_paths = [
    # The authorities themselves + kernel-internal solvers.
    "ambition_platformer2d_core/src/movement/",
    "ambition_platformer2d_core/src/ledge_grab/",
    # Engine body-shape ops (feet-planted resize recenters).
    "ambition_platformer2d_core/src/player_state.rs",
    # Sanctioned domain integrators: generic kinematic bodies, projectile
    # physics, free thrown items, and the portal core's aperture transit
    # (whose kernel-body reconciliation is completed by the content adapter).
    "ambition_platformer2d_shared_tangle/src/kinematic.rs",
    "ambition_platformer2d_shared_tangle/src/projectile/",
    "ambition_projectiles/src/",
    "ambition_portal2d/src/transit.rs",
    "ambition_platformer2d_actor_monolith/src/items/pickup/",
    # Dev tooling body-profile resize (feet-planted recenter).
    "ambition_dev_tools/src/dev_tools/editable.rs",
    # Domain integrator, and the third crate in a set of three: the ECS system
    # that steps projectiles snaps a shot's endpoint back to the first solid on
    # the leg it just flew. Its `kin` is `&mut BodyKinematics` under
    # `With<LiveProjectile>` — the shared position component on a body that has
    # no `MotionModel` and no contact clusters, so `transit_body` cannot be
    # called on it at all. Exactly the "cannot tell a live body from a thing
    # that merely carries BodyKinematics" blind spot this rule's own rationale
    # describes, and the same class as `ambition_projectiles/src/` above.
    # Scoped to the FILE, not the directory, so an actor-body write elsewhere
    # in the module still fails.
    "ambition_platformer2d_actor_monolith/src/projectile/systems.rs",
    # A PRESCRIBED CONTENT WORLDLINE, and the one file that is allowed to be
    # one. TwinTrack's chase beacon is a marker + `BodyKinematics` + `SimId`: no
    # `MotionModel`, no contact clusters, so there is nothing for `transit_body`
    # to reconcile and it cannot be called on the entity at all. Its position is
    # evaluated analytically from the pursuit's start event because the optics
    # solver's null tolerance is a measurement OF THE SOLVER only while the
    # worldline is exactly the line the solver assumes.
    # scoped to this file rather than to the demo ON PURPOSE: `lib.rs` moves
    # the TRAVELER, a full actor, and has lost its `transit_body` fix twice to
    # successive SR overlays. It stays covered.
    "ambition_demo_twintrack/src/chase_beacon.rs",
]

# `ResolvedMotionFrame::publish`'s doc said "ONLY the frame resolution phase may
# call this (guarded by workspace policy, not just convention)". No such policy
# existed. The invariant happened to hold — two production callers, both in
# `gravity/resolve.rs` — but nothing was checking, and ADR 0024's frame law is
# built on the resolved frame being published exactly once per tick by one phase.
#
# **the method's NAME is why no rule could exist.** A forbidden-source rule matches text, and
# `.publish(` collides with `sprites.publish`, `damageable.publish`, `sessions.publish` and
# `registry.publish` — so any rule naming it would have fired on four unrelated seams. A claim
# of enforcement that cannot be written down is a claim nobody can keep.
[[policy]]
id = "engine.only-the-frame-phase-publishes-the-resolved-frame"
scope = "engine"
kind = "forbidden-source-reference"
owners = ["ambition_platformer2d_shared_tangle", "ambition_platformer2d_actor_monolith"]
watch_paths = ["crates", "game"]
rationale = "ADR 0024 frame law: the per-tick ResolvedMotionFrame is published ONCE, by the frame resolution phase. A second publisher is a second frame authority, and every mechanic downstream reads whichever ran last."
source_doc = "docs/adr/0024-frame-aware-unified-movement-kernel.md"
severity = "error"
production_only = true
skip_tests = true
roots = ["crates", "game"]
forbid = ["publish_resolved_frame("]
skip_paths = [
    # The frame resolution phase itself — the one authority.
    "ambition_platformer2d_actor_monolith/src/gravity/",
    # The accessor's own definition.
    "ambition_platformer2d_shared_tangle/src/frame_env.rs",
]

# `authority.rs`'s own module doc says "every production write to authoritative
# body pose/VELOCITY belongs to exactly one named authority", and lists impulses
# as authority #4. The rule above enforced `pos` and nothing enforced `vel` — so
# half a documented contract was a habit, and the sentence "guarded by workspace
# policy" was true of one noun in it.
#
# That gap is why "who wrote this velocity" was expensive to answer: the
# ladder investigation spent six wrong readings on a `-99`/tick ramp whose author
# was a `vel -=` the log could not see, and the eventual answer (the fighter's own
# slash recoil) came from an operation the kernel already emitted rather than from
# anything a velocity write announced.
#
# AGENTS.md's "avoid bullshit guardrails" bar, answered rather than assumed: this is not a new
# CATEGORY of machinery, it is the missing half of a policy that already exists and is already
# sanctioned. The more natural enforcement — making `BodyKinematics.vel` private behind
# authority-only setters — is genuinely better and genuinely bigger: the field is READ across the
# whole engine, so it is accessor churn on a scale this does not justify alone. If that refactor
# ever happens, DELETE this rule rather than keep both.
#
# the skip list is deliberately the SAME set as the pose rule. Those are the
# named authorities of ADR 0024; if a path is a sanctioned pose authority it is a
# sanctioned velocity authority, and any divergence between the two lists would be
# a claim that a site may move a body but not change how it is moving, which the
# ADR does not say about anything.
[[policy]]
id = "engine.velocity-writes-are-authority-only"
scope = "engine"
kind = "forbidden-source-reference"
owners = ["ambition_platformer2d_core", "ambition_platformer2d_actor_monolith"]
watch_paths = ["crates", "game"]
rationale = "ADR 0024 authority model: body VELOCITY writes go through the kernel, transit_body, an impulse seam, or a sanctioned domain integrator — never a bare field write. The pose half was enforced; this is the half that was not. KNOWN BLIND SPOT: matching is by receiver NAME (kin/kinematics/body), not by type, so a BodyKinematics bound to a fourth identifier passes unseen — which is how the TwinTrack demo relocated a body outside the authority for two days. SECOND KNOWN BLIND SPOT (2026-08-16): matching by name also cannot tell a SIMULATED body from a SCRATCH one. `BodyClusterScratch` is an owned bag with no entity, no resolved frame and no integrator — the fighter brain's recovery lens builds one to ask 'what would this body do' — so its initial velocity is state being STATED, not a body being changed, and there is no authority to route it through. That site now says it at construction (`BodyClusterScratch::with_velocity`); see the pose rule for the same distinction on the seed side."
source_doc = "docs/adr/0024-frame-aware-unified-movement-kernel.md"
severity = "error"
production_only = true
skip_tests = true
roots = ["crates", "game"]
forbid = [
    "kin.vel = ", "kin.vel += ", "kin.vel -= ",
    "kinematics.vel = ", "kinematics.vel += ", "kinematics.vel -= ",
    "kin.vel.x = ", "kin.vel.y = ", "kinematics.vel.x = ", "kinematics.vel.y = ",
    # See the pose rule: this matches a NAME, and TwinTrack's traveler was bound
    # as `body`. Both halves of the authority had the same hole.
    " body.vel = ", " body.vel += ", " body.vel -= ",
    " body.vel.x = ", " body.vel.y = ",
]
skip_paths = [
    # The authorities themselves + kernel-internal solvers.
    "ambition_platformer2d_core/src/movement/",
    "ambition_platformer2d_core/src/ledge_grab/",
    # Engine body-shape ops (feet-planted resize recenters).
    "ambition_platformer2d_core/src/player_state.rs",
    # Sanctioned domain integrators: generic kinematic bodies, projectile
    # physics, free thrown items, and the portal core's aperture transit.
    "ambition_platformer2d_shared_tangle/src/kinematic.rs",
    "ambition_platformer2d_shared_tangle/src/projectile/",
    "ambition_projectiles/src/",
    "ambition_portal2d/src/transit.rs",
    "ambition_platformer2d_actor_monolith/src/items/pickup/",
    # Dev tooling body-profile resize (feet-planted recenter).
    "ambition_dev_tools/src/dev_tools/editable.rs",
    # ── velocity-only, each NAMED rather than blanket-skipped ──
    # ADR 0024 authority #4, verbatim: "Impulses — typed velocity operations that
    # consume the body's resolved frame: `set_jump_velocity`,
    # `AccelerationFrame::launch`, and frame-rotated `vel +=` writes at
    # combat/ability seams." These are those seams.
    "ambition_combat/src/moveset/mod.rs",
    "ambition_platformer2d_actor_monolith/src/features/ecs/damage/actor_hit.rs",
    # Traversal abilities that SET a velocity rather than adding an impulse: a
    # grapple pull is a commanded speed toward the anchor, not a nudge.
    "ambition_abilities/src/traversal/grapple.rs",
    # Domain integrator: a projectile reflecting off a surface, mirroring its own
    # velocity. The same class as the projectile paths already listed above.
    "ambition_platformer2d_actor_monolith/src/projectile/systems.rs",
    # ⭐ THE SAME WRITE, MOVED — and the guard catching that is the ledger
    # working exactly as designed. `intercept_projectile` lifted the reflection
    # out of `systems.rs` so a reflector and an absorber could share it, and the
    # sanctioned write went with it while the waiver did not. The justification
    # is unchanged and is the one above verbatim: this is the projectile domain
    # re-aiming its own body, not a foreign system relocating somebody else's.
    # ⇒ Waived at the OPERATION rather than at its callers, which is the point of
    # having an operation: the next interception adds no entry here.
    "ambition_platformer2d_actor_monolith/src/projectile/intercept.rs",
    # GAME bodies with their own motion rules, not engine bodies: Mary-O's
    # snake segments and Sanic's ball dash. Listed individually rather than
    # skipping `game/`, so a NEW game reaching for a bare velocity write still
    # fails and has to argue for itself.
    "ambition_demo_mary_o/src/snake.rs",
    "ambition_demo_sanic/src/ball_dash.rs",
    # ── three more of authority #4, added 2026-08-30 ──
    # ⭐ THE OWNERSHIP RULE DID NOT CHANGE; THE LEDGER LAGGED THE SEAMS. Each of
    # these is one of the forms quoted above, in a file that was never listed.
    #   clank rebound — a combat seam. Two attacks trade and both bodies take an
    #   impulse along the axis between them; the same class as
    #   `features/ecs/damage/actor_hit.rs` already listed.
    "ambition_combat/src/clank.rs",
    #   ledge trump pop — a FRAME-ROTATED `vel +=` in the literal sense the ADR
    #   means: it projects out the component along the body's own `side` axis
    #   and re-adds the pop there, because under sideways gravity a fighter's
    #   outward IS world Y and a bare `vel.x` popped it along the axis it falls
    #   on.
    "ambition_combat/src/ledge_trump.rs",
    #   trapdoor entry — a traversal ability that SETS a velocity rather than
    #   adding an impulse, the same distinction `grapple.rs` above is listed
    #   under. Entering `Submerged` switches collision off, so a leftover fall
    #   would carry the body through the world for the one tick before the
    #   submerged integrator overwrites it.
    "ambition_platformer2d_actor_monolith/src/abilities/traversal/trapdoor.rs",
    # The same prescribed content worldline the pose rule above waives, and for
    # the same reason: a clusterless beacon whose velocity IS the authored fact
    # the pursuit is about. Its file, not its demo.
    "ambition_demo_twintrack/src/chase_beacon.rs",
]

