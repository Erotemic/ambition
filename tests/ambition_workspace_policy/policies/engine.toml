# It is the module this rule is about, and presentation code referring to
# `crate::presentation` is the one case that would be legitimate — a
# forward-looking exemption, not a fossil. That is the distinction worth drawing:
# a path naming a DELETED file is stale by definition; a live path holding no
# forbidden token may simply be waiting.
