# was: architecture_boundaries_actor_dialog_keeps_only_game_bindings
[[policy]]
id = "engine.actor-dialog-no-runtime-reexport"
scope = "engine"
kind = "file-omits"
owners = ["ambition_conversation"]
# **the file MOVED, so the watch moved with it.** The host
# glue left the actor monolith for `ambition_conversation`, the crate that owns
# the conversation authority this dialogue runtime is driven by. Re-pointing is
# the only correct edit: a `file-omits` policy whose file does not exist is not a
# passing guard, it is a panic — exactly what the retired
# `engine.actor-yarn-no-runtime-reexport` note below records.
watch_paths = ["crates/ambition_conversation/src/dialog.rs"]
rationale = "actor dialog does not re-export reusable dialog runtime vocabulary"
source_doc = "docs/architecture/architecture-boundaries.md"
severity = "error"
# **the three system NAMES came out, and this is a narrowing of
# the rule rather than an exemption for a file.** The rationale is about
# RE-EXPORTING vocabulary; `kind = "file-omits"` is a flat substring search and
# cannot tell `pub use ambition_dialog::dialog_input` — the thing forbidden —
# from `add_systems(Update, ambition_dialog::dialog_input)`, which is a plugin
# REGISTERING a system it does not own and is the whole point of the 08-02 move
# (`ambition_app` hand-registered the dialogue presentation pair, so any other
# composition installed dialogue and got no input handling and no typewriter
# reveal). `pub use ambition_dialog` still catches every actual re-export,
# including of these three, because a re-export must name the module path.
# the alternative — adding `dialog.rs` to an exemption list — would have
# switched the whole policy off for the one file it watches.
forbid = ["pub use ambition_dialog", "DialogChoice", "DialogChoiceSlot", "DialogueRunnerEntity"]
file = "crates/ambition_conversation/src/dialog.rs"

# It watched `…/src/dialog/yarn_bindings.rs` and forbade `pub use ambition_dialog` there.
# `73873491b` moved this game's Yarn vocabulary — give_item, buy_item, sell_item, challenge,
# use_brain, restore_brain and the save-state mirror — out to `ambition_content` through
# `ambition_dialog`'s `YarnContentBindings` installer seam, and `dialog/` is now empty of content.
# **A file-omits policy whose file does not exist is not a passing guard, it is a panic**, which is
# how this surfaced: `every_watch_path_exists` and `engine_policies` both failed on the one missing
# path. the boundary it defended is now STRUCTURAL and stronger than the rule: an engine crate
# cannot re-export vocabulary it no longer contains. Nothing in `crates/` or `game/` re-exports
# `ambition_dialog` except the umbrella facade (`ambition_platformer2d`), which is deliberately the
# public API surface. Re-pointing it at `ambition_content` would be a DIFFERENT policy — different
# scope, different owner, and guarding a game crate rather than an engine one.


# It forbade `DeveloperPersistenceSchedulePlugin` inside `…/src/persistence/mod.rs` — an eleven-line
# compatibility adapter that re-exported `ambition_persistence::{save, save_data,
# PersistenceSchedulePlugin}` on the historical path. **The whole module is deleted**: its only real
# content, the `settings::model` pause-menu vocabulary, had no consumer anywhere in the workspace
# (all eight of its public names were referenced only by doc comments), and every
# `crate::persistence::settings::…` path was repointed at `ambition_persistence::settings`. the
# boundary it defended is now STRUCTURAL and stronger than the rule: a module that does not exist
# cannot alias anything. What replaces it is `engine.actors-persistence-facade-gone`, which forbids
# the DIRECTORY, so the adapter cannot come back under a different filename either.


