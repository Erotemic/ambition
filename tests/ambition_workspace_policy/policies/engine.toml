# ── architecture_boundaries.rs decomposition, batch 2 (Task 9): crate-purity +
#    consumer-vocab rules migrated declaratively (generated). ─────────────────

# ⛔⛔ THE PORTAL MAP CONVENTION WAS A `static AtomicBool`, 2026-08-30. It was
# mirrored from `PortalTuning::convention` by a per-frame system, so every
# consumer read the global instead of the resource that owns it: two providers
# in one process could not disagree, load order decided who won, and a static is
# not rollback state — a convention the inspector changed mid-session did not
# rewind with the world. Its DEFAULT also disagreed with the tuning's
# (Reflection vs Rotation), which every fixture that never ran the mirror
# silently inherited.
#
# The convention is a threaded parameter now. This forbids the shape coming
# back: process-global mutable state in the crate that owns the pure math.
[[policy]]
id = "engine.platformer-math-holds-no-process-state"
scope = "engine"
kind = "forbidden-source-reference"
owners = ["ambition_platformer2d_shared_tangle"]
watch_paths = ["crates/ambition_platformer2d_shared_tangle/src/math.rs"]
rationale = "portal map math is pure; its convention is session authority threaded as a value, never a process global"
source_doc = "docs/planning/engine/simulation-authority-and-determinism.md"
severity = "error"
roots = ["crates/ambition_platformer2d_shared_tangle/src/math.rs"]
forbid = ["AtomicBool", "AtomicU8", "AtomicUsize", "static mut", "OnceLock", "thread_local"]

# was: architecture_boundaries_platformer_runtime_stays_content_free
#
# FOUR POLICIES DESCRIBED THE SHAPE OF A COMPATIBILITY SHIM
# (`.../src/platformer_runtime`): that it stayed content-free, that it had
# shrunk to the right files, and that two of those files re-exported the
# extracted crate. All four went away with the shim on 2026-08-30, at the
# instruction of its own TODO: *"migrate the callers to their owning crates,
# then delete those re-export modules and leave no generic runtime facade
# inside the actor monolith."* Two of them were RED because the migration had
# finished and the re-exports were gone — a policy asking a deleted forwarding
# module to come back, exactly like `engine.actor-physics-facade` before it.
#
# What replaces them is the rule they were standing in for. A shim's shape is
# not a boundary; "the actor crate does not hold a generic runtime facade" is.
[[policy]]
id = "engine.no-generic-runtime-facade-in-the-actor-crate"
scope = "engine"
kind = "forbidden-path"
owners = ["ambition_platformer2d_shared_tangle"]
watch_paths = ["crates/ambition_platformer2d_actor_monolith/src"]
rationale = "generic platformer-runtime vocabulary lives in its own crate; the actor monolith may not re-export it under a facade"
source_doc = "docs/architecture/architecture-boundaries.md"
severity = "error"
paths = ["crates/ambition_platformer2d_actor_monolith/src/platformer_runtime", "crates/ambition_platformer2d_actor_monolith/src/physics.rs"]


