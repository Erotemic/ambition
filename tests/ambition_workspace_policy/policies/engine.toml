[[policy]]
id = "engine.runtime-manifest-allow"
scope = "engine"
kind = "dependency-allowlist"
owners = ["ambition_platformer2d_runtime"]
watch_paths = ["crates/ambition_platformer2d_runtime/Cargo.toml"]
rationale = "runtime composes sim/mechanic/model/dev-state crates, not app/content/host/render"
source_doc = "docs/architecture/architecture-boundaries.md"
severity = "error"
allow = ["ambition_platformer2d_actor_monolith", "ambition_projectiles", "ambition_combat", "ambition_encounter", "ambition_dialog", "ambition_characters", "ambition_portal2d", "ambition_sim_view", "ambition_vfx", "ambition_time", "ambition_input", "ambition_platformer2d_core", "ambition_sfx", "ambition_persistence", "ambition_menu", "ambition_items", "ambition_platformer2d_shared_tangle", "ambition_dev_tools", "ambition_platformer2d_world", "ambition_load",
    # Causal vocabulary is a foundation dependency used by runtime-side recording.
    "ambition_causal",
    # Cutscene mechanics are lower-tier simulation state composed by the runtime.
    "ambition_cutscene",
    # Runtime snapshots provider-authored sheet vocabulary from this leaf crate.
    "ambition_sprite_sheet",
    "ambition_character_sprites",
    # Runtime composes the LDtk adapter and owns its rollback/session integration.
    "ambition_platformer2d_ldtk",
    # The registration protocol the rollback registry answers (2026-09-03):
    # dependency-free, below every registry.
    "ambition_registry_core",
    # Conversation continuity is lower-tier domain state composed by the runtime.
    "ambition_conversation",
    # Boss-encounter state is lower-tier domain state composed by the runtime.
    "ambition_boss_encounter",
    # Player/victim hit resolution: the runtime schedules `apply_player_hit_events`
    # and `stage_player_victim_hit_events` into its player/combat chains and
    # registers `WalletShieldSpent` beside them. Same relationship as
    # `ambition_combat`; the row was simply never added when damage was carved out.
    "ambition_damage",
    # Mount/rider link enforcement plus the four dismount/ride message channels.
    "ambition_mount",
    # The room-feature side of encounters (2026-09-03): LDtk loading, ECS
    # spawning, banners, save/quest projection. Composed by the runtime for the
    # same reason as `ambition_world_items` below — a domain carved out of the
    # actor kernel is added HERE, so no registration for it lands back in the
    # kernel. The runtime additionally owns the two orderings that span the
    # carve (`encounter_spawn_service`, `world_gating`), because after the cut
    # it is the only crate that can name both sides.
    "ambition_encounter_features",
    # The TOUCHED collectible (D33, 2026-09-02), composed here for the same
    # reason as `ambition_mount` and `ambition_damage` above: a domain carved out
    # of the actor monolith is added by the RUNTIME, so no registration for it
    # lands back in the kernel. `WorldItemSimulationPlugin` sits beside
    # `ItemPickupSimulationPlugin`, its sibling across the touched/pressed split.
    "ambition_world_items",
    # The PRESSED collectible (D33, 2026-09-03), the other half of that split:
    # `HeldItemSimulationPlugin` owns `ItemPickupSet::CoreHeldItems` end to end
    # and the runtime adds it beside the kernel's `ItemPickupSimulationPlugin`,
    # which keeps the other two variants and the three-variant chain.
    "ambition_held_items",
    # The WIELDED kit (D33, the abilities carve, 2026-09-03).
    # `AbilitySimulationPlugin` owns `ItemPickupSet::ThrownItemEffects` and
    # `ItemPickupSet::WieldedAbilities` end to end, and the runtime adds it
    # beside the other two. ⛔ After this carve the kernel's
    # `ItemPickupSimulationPlugin` configures NO variant at all — it keeps only
    # the three-variant chain, which orders sets owned by two other crates and
    # so can live nowhere else.
    "ambition_abilities",
    # One diagnostic resource, `GameplayTraceBuffer` — the same shape as the
    # `ambition_causal` row above.
    "ambition_gameplay_trace"]
manifest = "crates/ambition_platformer2d_runtime/Cargo.toml"

