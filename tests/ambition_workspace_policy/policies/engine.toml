# ⛔⛔ THE PUREST CRATE IN THE WORKSPACE HAD NOTHING HOLDING IT THAT WAY.
# `engine/relativity.md` states the boundary as ownership — *"`ambition_relativity`
# owns dimension-independent Minkowski interval, proper-time, rapidity,
# velocity-composition, event-boost, and photon-frequency mathematics. It has no
# Bevy dependency."* — and that is the load-bearing half of the layering diagram
# beneath it: the maths is dimension-independent BECAUSE it knows nothing about
# an engine, which is what lets `ambition_relativity2d` be the only 2D-aware
# layer and a later GR provider slot in beside it.
#
# ⚠ Measured 2026-09-03: the claim holds and NOTHING ENFORCED IT. The crate's
# `Cargo.toml` has no `[dependencies]` section at all and its 722 lines carry a
# single `use core::fmt`. That is purity by nobody having spent it yet, not
# purity by a ratchet — the same shape as the two carves that shipped without
# boundary rows earlier tonight.
#
# ⛔ AND A `dependency-allowlist` ROW WOULD NOT HAVE GUARDED THIS ONE, which is
# why the rule kind here is the source scan. `ambition_deps` reads only
# `ambition*` entries, so an allowlist says nothing about `bevy`; and an EMPTY
# allow list is refused by the rule on purpose ("that forbids ALL ambition deps;
# if that is intended, say so explicitly"). Forbidding the two tokens in SOURCE
# says both halves at once and needs no ceiling to keep in step.
#
# Substring rather than `whole_ident` deliberately: `bevy` must also catch
# `bevy_math`, `bevy_ecs` and friends, which a whole-identifier match would let
# through.
[[policy]]
id = "engine.ambition_relativity-stays-engine-free"
scope = "engine"
kind = "forbidden-source-reference"
owners = ["ambition_relativity"]
watch_paths = ["crates/ambition_relativity/src"]
source_doc = "docs/planning/engine/relativity.md"
severity = "error"
rationale = "The dimension-independent relativity maths is dimension-independent because it knows about no engine and no dimension. A `bevy` reference makes it a Bevy crate and collapses the provider seam; an `ambition_` reference makes it a consumer of the layer that is supposed to consume IT."
roots = ["crates/ambition_relativity/src"]
forbid = [
  "bevy",
  "ambition_",
]

# ── the relativity cost contract, guarded (2026-09-03) ────────────────────────

[[policy]]
id = "engine.facade-all-capabilities-omits-relativity"
scope = "engine"
kind = "file-omits"
owners = ["ambition_platformer2d"]
watch_paths = ["crates/ambition_platformer2d/Cargo.toml"]
rationale = "docs/planning/engine/relativity.md states a cost contract -- games that do not enable the `relativity` feature do not link either relativity crate -- and that contract was FALSE for the three weeks after it was written. `relativity` sat inside the facade's `all_capabilities` aggregate until 2026-09-01, and `game/ambition_content` takes `all_capabilities`, so the shipped game linked `ambition_relativity` + `ambition_relativity2d` for weeks WITHOUT naming the feature. Verified fixed 2026-09-03: of the six shipped apps only `ambition_demo_twintrack_app` links them. A cost contract phrased as `games that do not opt in do not pay` is not enforced by the feature flag it names; it is enforced by every AGGREGATE feature that could contain it, and nothing asserted that until this row. The forbidden string is the quoted list-entry form and nothing else: the legitimate mentions in this manifest are a comment (backticked), the bare feature key `relativity = [..]`, and `dep:ambition_relativity` -- none of which contain a double-quoted `relativity`. So this trips if and only if the feature is added to some feature array, which is the regression. TwinTrack names the capability from ITS OWN manifest, which this row does not touch."
source_doc = "docs/planning/engine/relativity.md"
severity = "error"
forbid = ["\"relativity\""]
file = "crates/ambition_platformer2d/Cargo.toml"

