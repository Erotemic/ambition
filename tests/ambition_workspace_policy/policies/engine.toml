# ── One frame-aware movement kernel (ADR 0024) ── Every integrated movable body carries exactly ONE
# explicit `MotionModel`; absence is never a policy. An `Option<&MotionModel>` or
# `Without<MotionModel>` query is the "missing model means axis-swept" convention returning — the
# exact ambiguity the unified kernel removed.
[[policy]]
id = "engine.movement-model-is-never-optional"
scope = "engine"
kind = "forbidden-source-reference"
owners = ["ambition_platformer2d_core", "ambition_platformer2d_actor_monolith"]
watch_paths = ["crates", "game"]
rationale = "ADR 0024 §1: absence is never a movement policy. No production query may treat MotionModel as optional or filter on its absence; every integrated body carries a variant from spawn and dispatch happens inside step_motion. KNOWN BLIND SPOT (2026-08-16): the list below is a set of SPELLINGS, and `ae::` is the alias most of the workspace imports engine-core under — `Option<&ae::MotionModel>` escaped it entirely. The escape hid the actual §1 violation behind the one site this rule DID catch: `actors/update.rs` passed its optional read down to `perception_body_for`, whose `None` arm read a missing component as `AxisSweptMotion::default()`. Both are non-optional now. ⛔ the spelling is NOT added to `forbid` yet because one further site survives it — `ambition_sim_view/src/combat_geometry_view.rs:152`, an observation read-model whose whole body-cluster group is optional — and widening the rule tonight would have reddened a crate this slice did not analyse. That is a queue row, not a waiver."
source_doc = "docs/adr/0024-frame-aware-unified-movement-kernel.md"
severity = "error"
production_only = true
skip_tests = true
roots = ["crates", "game"]
forbid = [
    "Option<&MotionModel>", "Option<&mut MotionModel>", "Without<MotionModel>",
    "Option<&crate::features::MotionModel>", "Option<&mut crate::features::MotionModel>",
    "Without<crate::features::MotionModel>",
    "Option<&'static MotionModel>", "Option<&'static mut MotionModel>",
    "Option<&'static mut crate::features::MotionModel>",
]

