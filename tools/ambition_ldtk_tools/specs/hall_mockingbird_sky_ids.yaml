  - target:
      identifier: MovingPlatform
      match:
        id: mockingbird_sky_shark_6
    fields:
      id: hall_mockingbird_sky_shark_6
  - target:
      identifier: MovingPlatform
      match:
        id: mockingbird_sky_shark_7
    fields:
      id: hall_mockingbird_sky_shark_7
  - target:
      identifier: MovingPlatform
      match:
        id: mockingbird_sky_shark_8
