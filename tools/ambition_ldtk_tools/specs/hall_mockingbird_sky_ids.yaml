# The Hall of Bosses' own Mockingbird sky (a clone of `mockingbird_sky`):
# its own placement, its own ids, and its way down to the hall's shore.
level_id: hall_mockingbird_sky
edits:
  - target:
      identifier: BossSpawn
      match:
        encounter_id: cove.mockingbird
    fields:
      encounter_id: hall.mockingbird
  - target:
      identifier: LoadingZone
      match:
        id: mockingbird_sky_to_shore
    fields:
      id: hall_mockingbird_sky_to_shore
      target_room: hall_mockingbird_arena
      target_zone: hall_mockingbird_arena_to_sky
  - target:
      identifier: CameraZone
      match:
        id: mockingbird_sky_camera
    fields:
      id: hall_mockingbird_sky_camera
      name: hall_mockingbird_sky_camera
  - target:
      identifier: PlayerStart
      match:
        name: mockingbird_sky_spawn
    fields:
      name: hall_mockingbird_sky_spawn
  - target:
      identifier: MovingPlatform
      match:
        id: mockingbird_sky_shark_1
    fields:
      id: hall_mockingbird_sky_shark_1
  - target:
      identifier: MovingPlatform
      match:
        id: mockingbird_sky_shark_2
    fields:
      id: hall_mockingbird_sky_shark_2
  - target:
      identifier: MovingPlatform
      match:
        id: mockingbird_sky_shark_3
    fields:
