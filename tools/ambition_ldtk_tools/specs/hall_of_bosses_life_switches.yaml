# The Hall of Bosses' life switches (Jon, 2026-10-06): one by each boss door,
# green while that hall boss is alive, red while it is dead. A press revives
# a dead boss or kills a living one (`SwitchAction::BossLife`).
level_id: hall_of_bosses
entities:
  - type: Switch
    px: [220, 304]
    size: [24, 32]
    fields:
      id: hall_warden_life_switch
      name: Clockwork Warden life switch
      prompt: "Revive or defeat the Clockwork Warden"
      target_encounter: hall.clockwork_warden
      action: BossLife
