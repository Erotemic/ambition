# The Hall of Bosses' own copy of Castle Godwin's throne room (2026-10-17):
# made with
#
#   PYTHONPATH=tools/ambition_ldtk_tools python3 -m ambition_ldtk_tools level clone \
#       castle_godwin_throne hall_wolfenstein_arena --world-x 12080 --world-y 0 \
#       --ldtk game/ambition_map_assets/ambition_content/worlds/evil.ldtk --in-place
#
# then these edits make its ids its own: its door goes back to the hall, and
# its Wolfenstein is the hall's encounter, not the story's.
#
#   PYTHONPATH=tools/ambition_ldtk_tools python3 -m ambition_ldtk_tools entity set-field \
#       tools/ambition_ldtk_tools/specs/hall_wolfenstein_arena_ids.yaml \
#       --ldtk game/ambition_map_assets/ambition_content/worlds/evil.ldtk --in-place
level_id: hall_wolfenstein_arena
edits:
  - target: { identifier: LoadingZone, match: { id: castle_godwin_throne_west } }
    fields:
      id: hall_wolfenstein_arena_entry
      name: to hall of bosses
      target_room: hall_of_bosses
      target_zone: hall_to_wolfenstein_portal
  - target: { identifier: BossSpawn, match: { name: Wolfenstein } }
    fields:
      encounter_id: hall.wolfenstein
  - target: { identifier: PlayerStart }
    fields:
      name: hall_wolfenstein_arena_start
  - target: { identifier: CameraZone }
    fields:
      id: hall_wolfenstein_arena_camera
      name: hall_wolfenstein_arena_camera
  - target: { identifier: DebugLabel }
    fields:
      name: hall_wolfenstein_arena_label
      text: "Hall of Bosses: Wolfenstein, on the leash."
