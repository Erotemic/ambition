[project]
name = "ambition-moveset-inspector"
version = "0.1.0"
description = "Frame data, hitbox geometry and balance comparison for Ambition's smash cast."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ambition_moveset_inspector*"]
