# The links of the History atlas. Each row: [a, b, kind, note].
#
# kind (roadmap section 3):
#   succession     - a later setting in the same broad place
#   contact        - people of the two places met (trade, migration, war)
#   diffusion      - a thing or idea went from one to the other, by others
#   comparison     - shown side by side; no claim that they met
#   atlas_shortcut - a way of the game that is not a historical link; the
#                    place must say it is the atlas's fiction
#
# The `built:` list is the ways the game has now (`make_specs.py`): each is
# also checked against the game's world file by `history_atlas.py check`.

