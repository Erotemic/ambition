# The places of the History atlas: each node is a place in a time.
# This is a finite representative superset, not a list of mandatory rooms.
#
# id        - unique; a built node's room id is in `room`.
# title     - the place, as a sign would say it.
# region    - a region of `frame.yaml`.
# years     - [from, to]; negative is BCE (deep time: years before now,
#             written as negative years, near enough at that scale).
# status    - built (a room of history.ldtk), planned (in the waves of
#             docs/planning/game/history-dimension.md), candidate (the pool).
# countries - the modern countries whose players find their history here.
# peoples   - peoples of `peoples.yaml` whose history this is.
# topics    - topics of `topics.yaml` this place shows.
# mode      - grounded (default), parody (the famous, comically), sober
#             (a catastrophe told plainly), archive (Clio compares sources).
# shape     - room (default), corridor, hub, pocket, tall (`frame.yaml`).
# note      - what the room must get right, or what is wrong now.

nodes:
